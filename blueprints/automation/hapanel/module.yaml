blueprint:
  name: HAPanel — module
  description: >-
    Alimente toutes les pages d'un panneau HAPanel, une automatisation par
    module. Accueil : températures du séjour et de l'extérieur, mode, activité,
    consigne, préréglage et verrou du thermostat, bornes de la consigne. Météo :
    conditions actuelles et prévisions sur 3 jours. Planning : créneaux du jour
    de 1 à 4 calendriers. Scénarios : 6 scènes, scripts ou automatisations au
    plus, lancés depuis le panneau. Envoi à chaque changement, toutes les 5 minutes, au
    démarrage de Home Assistant et quand le panneau le demande (connexion).
    Exécute les commandes du panneau (allumer, couper, consigne, préréglage)
    seulement si elles viennent de ce panneau, si le thermostat est disponible
    et non verrouillé et si la consigne est dans les bornes ; consigne et
    préréglage exigent un chauffage allumé. Le module doit être autorisé à
    effectuer des actions Home Assistant (options de l'intégration ESPHome).
    Décisions D014, D015, D019, D020, D021 et D024 du dépôt cnuma/HAPanel.
  domain: automation
  source_url: https://github.com/cnuma/HAPanel/blob/main/blueprints/automation/hapanel/module.yaml
  input:
    panneau:
      name: Panneau
      description: Module HAPanel destinataire.
      selector:
        device:
          filter:
            - integration: esphome
    thermometre:
      name: Thermomètre
      description: Température affichée en grand (séjour).
      selector:
        entity:
          filter:
            - domain: sensor
    thermometre_exterieur:
      name: Thermomètre extérieur
      description: Température extérieure affichée sous celle du séjour.
      selector:
        entity:
          filter:
            - domain: sensor
    thermostat:
      name: Thermostat
      description: Thermostat commandé (modes heat et off).
      selector:
        entity:
          filter:
            - domain: climate
    consigne_min:
      name: Consigne minimale
      description: Le panneau ne descend pas la consigne en dessous.
      default: 15
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    consigne_max:
      name: Consigne maximale
      description: Le panneau ne monte pas la consigne au-dessus.
      default: 25
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    meteo:
      name: Météo
      description: >-
        Entité météo affichée. Pour la météo de la maison, choisir une entité
        dont l'intégration suit la localisation de Home Assistant (par exemple
        Met.no réglée sur « domicile »).
      selector:
        entity:
          filter:
            - domain: weather
    calendriers:
      name: Calendriers
      description: >-
        De 1 à 4 calendriers affichés. Le premier est le principal (résumé et
        frise) ; les suivants au-delà du quatrième sont ignorés.
      selector:
        entity:
          multiple: true
          filter:
            - domain: calendar
    scenarios:
      name: Scénarios
      description: >-
        Jusqu'à 6 scènes, scripts ou automatisations, chacun à sa place sur l'écran.
        Sans nom, le bouton porte celui de l'entité ; 24 caractères au plus. Une
        automatisation est lancée sans vérifier ses conditions.
      collapsed: true
      input:
        scenario_1: &scenario
          name: Scénario 1
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - scene
                    - script
                    - automation
        nom_1: &nom
          name: Nom du bouton 1
          default: ""
          selector:
            text:
        scenario_2:
          <<: *scenario
          name: Scénario 2
        nom_2:
          <<: *nom
          name: Nom du bouton 2
        scenario_3:
          <<: *scenario
          name: Scénario 3
        nom_3:
          <<: *nom
          name: Nom du bouton 3
        scenario_4:
          <<: *scenario
          name: Scénario 4
        nom_4:
          <<: *nom
          name: Nom du bouton 4
        scenario_5:
          <<: *scenario
          name: Scénario 5
        nom_5:
          <<: *nom
          name: Nom du bouton 5
        scenario_6:
          <<: *scenario
          name: Scénario 6
        nom_6:
          <<: *nom
          name: Nom du bouton 6

mode: queued
max: 20

variables:
  panneau: !input panneau
  thermometre: !input thermometre
  thermometre_exterieur: !input thermometre_exterieur
  thermostat: !input thermostat
  consigne_min: !input consigne_min
  consigne_max: !input consigne_max
  meteo: !input meteo
  calendriers: !input calendriers
  scenarios:
    - !input scenario_1
    - !input scenario_2
    - !input scenario_3
    - !input scenario_4
    - !input scenario_5
    - !input scenario_6
  noms:
    - !input nom_1
    - !input nom_2
    - !input nom_3
    - !input nom_4
    - !input nom_5
    - !input nom_6
  # Action ESPHome du module : esphome.<nom du noeud>_maj_valeur.
  action_maj: "esphome.{{ device_attr(panneau, 'name') | slugify }}_maj_valeur"

triggers:
  - trigger: state
    entity_id: !input thermometre
  - trigger: state
    entity_id: !input thermometre_exterieur
  # Sans « to » : se déclenche aussi sur les changements d'attributs
  # (consigne, activité, préréglage, verrou).
  - trigger: state
    entity_id: !input thermostat
  - trigger: state
    id: meteo
    entity_id: !input meteo
  - trigger: state
    id: planning
    entity_id: !input calendriers
  # Aussi le passage à minuit et les événements modifiés à l'avance, qui ne
  # changent pas l'état d'un calendrier.
  - trigger: time_pattern
    id: periodique
    minutes: "/5"
  - trigger: homeassistant
    id: demarrage
    event: start
  - trigger: event
    id: demande
    event_type: esphome.hapanel_demande_valeurs
  - trigger: event
    id: commande
    event_type: esphome.hapanel_commande

conditions:
  # Une demande ou une commande ne concerne que le panneau qui l'a émise.
  - condition: template
    value_template: >-
      {{ trigger.id not in ['demande', 'commande']
         or trigger.event.data.get('device_id') == panneau }}

actions:
  - variables:
      etat: "{{ states(thermostat) }}"
      disponible: "{{ etat not in ['unavailable', 'unknown'] }}"
      verrou: "{{ state_attr(thermostat, 'is_locked') == true }}"
      # Bornes du blueprint, resserrées à celles du thermostat.
      borne_min: >-
        {{ [consigne_min | float, state_attr(thermostat, 'min_temp') | float(consigne_min)] | max }}
      borne_max: >-
        {{ [consigne_max | float, state_attr(thermostat, 'max_temp') | float(consigne_max)] | min }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'commande' }}"
        sequence:
          - variables:
              commande: "{{ trigger.event.data.get('commande', '') }}"
              valeur: "{{ trigger.event.data.get('valeur', '') }}"
          - choose:
              # Scénario : le panneau n'envoie qu'un numéro, seules les entités
              # choisies ici peuvent être lancées (D024).
              - conditions:
                  - condition: template
                    value_template: "{{ commande == 'scenario' }}"
                sequence:
                  - variables:
                      n: "{{ valeur | int(0) }}"
                      cible: "{{ (scenarios[n - 1] or '') if 1 <= n <= 6 else '' }}"
                  - if:
                      # Une scène jamais activée est « unknown » : elle reste lançable.
                      - condition: template
                        value_template: >-
                          {{ cible != '' and states[cible] is not none
                             and states(cible) != 'unavailable' }}
                    then:
                      - action: >-
                          {{ cible.split('.')[0] }}.{{ 'trigger' if cible.startswith('automation.') else 'turn_on' }}
                        target:
                          entity_id: "{{ cible }}"
                      - action: "{{ action_maj }}"
                        data:
                          cle: scen_resultat
                          valeur: ok
                    else:
                      - action: "{{ action_maj }}"
                        data:
                          cle: scen_resultat
                          valeur: refus
                      - action: system_log.write
                        data:
                          level: warning
                          logger: hapanel.blueprint
                          message: "HAPanel : scénario refusé ({{ valeur }})"
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ commande == 'chauffage_mode' and valeur in ['heat', 'off']
                         and etat in ['heat', 'off'] and etat != valeur and not verrou }}
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      hvac_mode: "{{ valeur }}"
              # Consigne : chauffage allumé seulement (D015).
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ commande == 'chauffage_consigne' and valeur is number
                         and etat == 'heat' and not verrou
                         and borne_min <= valeur | float <= borne_max }}
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      temperature: "{{ valeur | float }}"
              # Préréglage : chauffage allumé seulement, préréglage connu du
              # thermostat.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ commande == 'chauffage_prereglage'
                         and valeur in (state_attr(thermostat, 'preset_modes') or [])
                         and etat == 'heat' and not verrou }}
                sequence:
                  - action: climate.set_preset_mode
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      preset_mode: "{{ valeur }}"
            default:
              - action: system_log.write
                data:
                  level: warning
                  logger: hapanel.blueprint
                  message: >-
                    HAPanel : commande refusée ({{ commande }} {{ valeur }},
                    thermostat {{ etat }}, verrou {{ verrou }})
    default:
      # Accueil : tout déclencheur, sauf ceux propres à la météo et au planning.
      - if:
          - condition: template
            value_template: "{{ trigger.id not in ['meteo', 'planning'] }}"
        then:
          - repeat:
              # Liste YAML : chaque valeur est rendue en texte. Un modèle qui
              # produirait toute la liste échoue, car hvac_action est une
              # énumération que Home Assistant ne sait pas relire dans une liste.
              for_each:
                - cle: temperature
                  valeur: "{{ states(thermometre) }}"
                - cle: temperature_exterieure
                  valeur: "{{ states(thermometre_exterieur) }}"
                - cle: chauffage_mode
                  valeur: "{{ etat }}"
                - cle: chauffage_action
                  valeur: >-
                    {{ (state_attr(thermostat, 'hvac_action') or 'unknown') | string
                       if disponible else 'unavailable' }}
                - cle: chauffage_consigne
                  valeur: >-
                    {{ (state_attr(thermostat, 'temperature') | string
                        if state_attr(thermostat, 'temperature') is not none else 'unknown')
                       if disponible else 'unavailable' }}
                - cle: chauffage_prereglage
                  valeur: >-
                    {{ (state_attr(thermostat, 'preset_mode') or 'none') | string
                       if disponible else 'unavailable' }}
                - cle: chauffage_verrou
                  valeur: "{{ ('on' if verrou else 'off') if disponible else 'unavailable' }}"
                - cle: consigne_min
                  valeur: "{{ borne_min }}"
                - cle: consigne_max
                  valeur: "{{ borne_max }}"
              sequence:
                - action: "{{ action_maj }}"
                  data:
                    cle: "{{ repeat.item.cle }}"
                    valeur: "{{ repeat.item.valeur }}"
      # Scénarios.
      - if:
          - condition: template
            value_template: "{{ trigger.id in ['periodique', 'demarrage', 'demande'] }}"
        then:
          - repeat:
              for_each: [0, 1, 2, 3, 4, 5]
              sequence:
                - variables:
                    i: "{{ repeat.item }}"
                    s: "{{ scenarios[i] or '' }}"
                - action: "{{ action_maj }}"
                  data:
                    cle: "scen_{{ i + 1 }}_nom"
                    valeur: >-
                      {{ '-' if not s else '?' if states(s) == 'unavailable'
                         else ((noms[i] or '') | trim or state_attr(s, 'friendly_name') or s)[:24] }}
      # Météo.
      - if:
          - condition: template
            value_template: "{{ trigger.id in ['meteo', 'periodique', 'demarrage', 'demande'] }}"
        then:
          # Entité indisponible : l'action échoue, le panneau reçoit « unknown » (P3).
          - action: weather.get_forecasts
            continue_on_error: true
            target:
              entity_id: "{{ meteo }}"
            data:
              type: daily
            response_variable: previsions
          - variables:
              jours: >-
                {{ previsions[meteo].forecast
                   if previsions is defined and meteo in previsions else [] }}
          # La condition d'abord : c'est elle qui donne l'état du groupe au panneau.
          - repeat:
              for_each:
                - cle: meteo_condition
                  valeur: "{{ states(meteo) }}"
                - cle: meteo_temperature
                  valeur: "{{ state_attr(meteo, 'temperature') | default('unknown', true) }}"
              sequence:
                - action: "{{ action_maj }}"
                  data:
                    cle: "{{ repeat.item.cle }}"
                    valeur: "{{ repeat.item.valeur }}"
          - repeat:
              for_each: [0, 1, 2]
              sequence:
                - variables:
                    j: "{{ repeat.item }}"
                    p: "{{ jours[j] if j < jours | length else {} }}"
                - repeat:
                    for_each:
                      # Lundi = 0 ; le jour vient de la prévision, pas de l'horloge.
                      - cle: "meteo_j{{ j + 1 }}_jour"
                        valeur: >-
                          {{ (p.datetime | as_datetime | as_local).weekday()
                             if p.datetime is defined else 'unknown' }}
                      - cle: "meteo_j{{ j + 1 }}_condition"
                        valeur: "{{ p.condition | default('unknown', true) }}"
                      - cle: "meteo_j{{ j + 1 }}_max"
                        valeur: "{{ p.temperature if p.temperature is defined and p.temperature is not none else 'unknown' }}"
                      - cle: "meteo_j{{ j + 1 }}_min"
                        valeur: "{{ p.templow if p.templow is defined and p.templow is not none else 'unknown' }}"
                    sequence:
                      - action: "{{ action_maj }}"
                        data:
                          cle: "{{ repeat.item.cle }}"
                          valeur: "{{ repeat.item.valeur }}"
      # Planning.
      - if:
          - condition: template
            value_template: "{{ trigger.id in ['planning', 'periodique', 'demarrage', 'demande'] }}"
        then:
          # Calendrier indisponible : l'action échoue, le panneau reçoit « unknown » (P3).
          - action: calendar.get_events
            continue_on_error: true
            target:
              entity_id: "{{ calendriers }}"
            data:
              start_date_time: "{{ today_at('00:00') }}"
              end_date_time: "{{ today_at('00:00') + timedelta(days=1) }}"
            response_variable: agenda
          - repeat:
              for_each: [0, 1, 2, 3]
              sequence:
                - variables:
                    i: "{{ repeat.item }}"
                    cal: "{{ calendriers[i] if i < calendriers | length else '' }}"
                    evenements: >-
                      {{ agenda[cal].events if agenda is defined and cal in agenda else none }}
                - repeat:
                    for_each:
                      # « Chauffage » est retiré : toute la page parle de chauffage.
                      - cle: "plan_{{ i + 1 }}_nom"
                        valeur: >-
                          {{ ((state_attr(cal, 'friendly_name') or cal)
                              | replace('Chauffage ', ''))[:14] if cal else '-' }}
                      # « h » puis 24 chiffres hexadécimaux, 4 quarts d'heure chacun. Le
                      # préfixe garde un texte : Home Assistant lirait sinon un nombre.
                      - cle: "plan_{{ i + 1 }}_creneaux"
                        valeur: >-
                          {%- if evenements is none -%}unknown{%- else -%}
                          {%- set minuit = today_at('00:00') -%}
                          {%- set r = namespace(texte='h') -%}
                          {%- for n in range(24) -%}
                            {%- set v = namespace(x=0) -%}
                            {%- for b in range(4) -%}
                              {%- set q = n * 4 + b -%}
                              {%- set a = namespace(actif=false) -%}
                              {%- for e in evenements -%}
                                {%- set d = ((e.start | as_datetime | as_local) - minuit).total_seconds() / 900 -%}
                                {%- set f = ((e.end | as_datetime | as_local) - minuit).total_seconds() / 900 -%}
                                {%- if d < q + 1 and f > q -%}{%- set a.actif = true -%}{%- endif -%}
                              {%- endfor -%}
                              {%- if a.actif -%}{%- set v.x = v.x + [8, 4, 2, 1][b] -%}{%- endif -%}
                            {%- endfor -%}
                            {%- set r.texte = r.texte ~ '0123456789abcdef'[v.x] -%}
                          {%- endfor -%}
                          {{- r.texte -}}
                          {%- endif -%}
                    sequence:
                      - action: "{{ action_maj }}"
                        data:
                          cle: "{{ repeat.item.cle }}"
                          valeur: "{{ repeat.item.valeur }}"
