blueprint:
  name: HAPanel — module
  description: >-
    Alimente toutes les pages d'un panneau HAPanel, une automatisation par
    module. Accueil : nom de la pièce, températures de la pièce et de l'extérieur, mode, activité,
    consigne, préréglage et verrou du thermostat, bornes de la consigne. Météo :
    conditions actuelles et prévisions sur 3 jours. Planning : créneaux du jour
    de 1 à 4 calendriers. Scénarios : 6 scènes, scripts ou automatisations au
    plus, lancés depuis le panneau. LED : réglages facultatifs, imposés au
    module. Envoi à chaque changement, toutes les 5 minutes, au
    démarrage de Home Assistant et quand le panneau le demande (connexion).
    Exécute les commandes du panneau (allumer, couper, consigne, préréglage)
    seulement si elles viennent de ce panneau, si le thermostat est disponible
    et non verrouillé et si la consigne est dans les bornes ; consigne et
    préréglage exigent un chauffage allumé. Le module n'a pas besoin d'être
    autorisé à effectuer des actions Home Assistant.
    Décisions D014, D015, D019, D020, D021, D024 et D026 du dépôt cnuma/HAPanel.
  domain: automation
  source_url: https://github.com/cnuma/HAPanel/blob/main/blueprints/automation/hapanel/module.yaml
  input:
    panneau:
      name: Panneau
      description: Module HAPanel destinataire.
      selector:
        device:
          filter:
            - integration: esphome
    thermometre:
      name: Thermomètre
      description: Température affichée en grand (la pièce du panneau).
      selector:
        entity:
          filter:
            - domain: sensor
    nom_piece:
      name: Nom de la pièce
      description: >-
        Affiché au-dessus de la température, 13 caractères visibles environ.
        Vide : la pièce (zone) du thermomètre dans Home Assistant, sinon
        « Intérieur ».
      default: ""
      selector:
        text:
    thermometre_exterieur:
      name: Thermomètre extérieur
      description: Température extérieure affichée sous celle de la pièce.
      selector:
        entity:
          filter:
            - domain: sensor
    thermostat:
      name: Thermostat
      description: Thermostat commandé (modes heat et off).
      selector:
        entity:
          filter:
            - domain: climate
    consigne_min:
      name: Consigne minimale
      description: Le panneau ne descend pas la consigne en dessous.
      default: 15
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    consigne_max:
      name: Consigne maximale
      description: Le panneau ne monte pas la consigne au-dessus.
      default: 25
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    meteo:
      name: Météo
      description: >-
        Entité météo affichée. Pour la météo de la maison, choisir une entité
        dont l'intégration suit la localisation de Home Assistant (par exemple
        Met.no réglée sur « domicile »).
      selector:
        entity:
          filter:
            - domain: weather
    calendriers:
      name: Calendriers
      description: >-
        De 1 à 4 calendriers affichés. Le premier est le principal (résumé et
        frise) ; les suivants au-delà du quatrième sont ignorés.
      selector:
        entity:
          multiple: true
          filter:
            - domain: calendar
    scenarios:
      name: Scénarios
      description: >-
        Jusqu'à 6 scènes, scripts ou automatisations, chacun à sa place sur l'écran.
        Sans nom, le bouton porte celui de l'entité ; 24 caractères au plus, 2 lignes
        avec une icône. Une
        automatisation est lancée sans vérifier ses conditions.
      collapsed: true
      input:
        scenario_1: &scenario
          name: Scénario 1
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - scene
                    - script
                    - automation
        nom_1: &nom
          name: Nom du bouton 1
          default: ""
          selector:
            text:
        icone_1: &icone
          name: Icône du bouton 1
          default: aucune
          selector:
            select:
              mode: dropdown
              options:
                - label: Aucune
                  value: aucune
                - label: Lumière
                  value: lumiere
                - label: Lumière éteinte
                  value: lumiere_eteinte
                - label: Soleil
                  value: soleil
                - label: Lune
                  value: lune
                - label: Maison
                  value: maison
                - label: Départ
                  value: depart
                - label: Retour
                  value: retour
                - label: Canapé
                  value: canape
                - label: Film
                  value: film
                - label: Musique
                  value: musique
                - label: Télévision
                  value: television
                - label: Lit
                  value: lit
                - label: Réveil
                  value: reveil
                - label: Repas
                  value: repas
                - label: Café
                  value: cafe
                - label: Chauffage
                  value: chauffage
                - label: Hors-gel
                  value: hors_gel
                - label: Ventilateur
                  value: ventilateur
                - label: Volets
                  value: volets
                - label: Prise
                  value: prise
                - label: Alarme
                  value: alarme
                - label: Verrou
                  value: verrou
                - label: Arrosage
                  value: arrosage
                - label: Vacances
                  value: vacances
                - label: Scénario
                  value: scenario
        couleur_1: &couleur
          name: Couleur du bouton 1
          default: bleu
          selector:
            select:
              mode: dropdown
              options:
                - label: Bleu
                  value: bleu
                - label: Vert
                  value: vert
                - label: Orange
                  value: orange
                - label: Rouge
                  value: rouge
                - label: Violet
                  value: violet
                - label: Turquoise
                  value: turquoise
                - label: Rose
                  value: rose
                - label: Gris
                  value: gris
        scenario_2:
          <<: *scenario
          name: Scénario 2
        nom_2:
          <<: *nom
          name: Nom du bouton 2
        icone_2:
          <<: *icone
          name: Icône du bouton 2
        couleur_2:
          <<: *couleur
          name: Couleur du bouton 2
        scenario_3:
          <<: *scenario
          name: Scénario 3
        nom_3:
          <<: *nom
          name: Nom du bouton 3
        icone_3:
          <<: *icone
          name: Icône du bouton 3
        couleur_3:
          <<: *couleur
          name: Couleur du bouton 3
        scenario_4:
          <<: *scenario
          name: Scénario 4
        nom_4:
          <<: *nom
          name: Nom du bouton 4
        icone_4:
          <<: *icone
          name: Icône du bouton 4
        couleur_4:
          <<: *couleur
          name: Couleur du bouton 4
        scenario_5:
          <<: *scenario
          name: Scénario 5
        nom_5:
          <<: *nom
          name: Nom du bouton 5
        icone_5:
          <<: *icone
          name: Icône du bouton 5
        couleur_5:
          <<: *couleur
          name: Couleur du bouton 5
        scenario_6:
          <<: *scenario
          name: Scénario 6
        nom_6:
          <<: *nom
          name: Nom du bouton 6
        icone_6:
          <<: *icone
          name: Icône du bouton 6
        couleur_6:
          <<: *couleur
          name: Couleur du bouton 6
    led:
      name: LED et écran
      description: >-
        Réglages de la LED et de l'écran du module, aussi modifiables sur la page
        de l'appareil et sur la page Réglages du module. « Ne pas imposer » les
        laisse libres ; une valeur choisie ici les remplace à la connexion et
        toutes les 5 minutes, et la page Réglages la montre grisée (D027, D031).
      collapsed: true
      input:
        led_mode:
          name: LED
          default: ne_pas_imposer
          selector:
            select:
              mode: dropdown
              options:
                - label: Ne pas imposer
                  value: ne_pas_imposer
                - label: Respiration
                  value: respiration
                - label: Éteinte
                  value: eteinte
        led_intensite:
          name: Intensité LED
          description: 100 % est le maximum ; 20 % par défaut sur le module.
          default: ne_pas_imposer
          selector:
            select:
              mode: dropdown
              options:
                - label: Ne pas imposer
                  value: ne_pas_imposer
                - { label: "0 %", value: "0" }
                - { label: "5 %", value: "5" }
                - { label: "10 %", value: "10" }
                - { label: "15 %", value: "15" }
                - { label: "20 %", value: "20" }
                - { label: "25 %", value: "25" }
                - { label: "30 %", value: "30" }
                - { label: "35 %", value: "35" }
                - { label: "40 %", value: "40" }
                - { label: "45 %", value: "45" }
                - { label: "50 %", value: "50" }
                - { label: "55 %", value: "55" }
                - { label: "60 %", value: "60" }
                - { label: "65 %", value: "65" }
                - { label: "70 %", value: "70" }
                - { label: "75 %", value: "75" }
                - { label: "80 %", value: "80" }
                - { label: "85 %", value: "85" }
                - { label: "90 %", value: "90" }
                - { label: "95 %", value: "95" }
                - { label: "100 %", value: "100" }
        led_alerte:
          name: Alerte LED
          description: Clignotement rouge quand l'état du chauffage n'est pas sûr.
          default: ne_pas_imposer
          selector:
            select:
              mode: dropdown
              options:
                - label: Ne pas imposer
                  value: ne_pas_imposer
                - label: Activée
                  value: "on"
                - label: Désactivée
                  value: "off"
        ecran_intensite:
          name: Intensité écran
          description: >-
            Multiplie la luminosité choisie selon la lumière de la pièce ; 100 %
            par défaut sur le module, 20 % au minimum.
          default: ne_pas_imposer
          selector:
            select:
              mode: dropdown
              options:
                - label: Ne pas imposer
                  value: ne_pas_imposer
                - { label: "20 %", value: "20" }
                - { label: "30 %", value: "30" }
                - { label: "40 %", value: "40" }
                - { label: "50 %", value: "50" }
                - { label: "60 %", value: "60" }
                - { label: "70 %", value: "70" }
                - { label: "80 %", value: "80" }
                - { label: "90 %", value: "90" }
                - { label: "100 %", value: "100" }

mode: queued
max: 20

variables:
  panneau: !input panneau
  thermometre: !input thermometre
  nom_piece: !input nom_piece
  thermometre_exterieur: !input thermometre_exterieur
  thermostat: !input thermostat
  consigne_min: !input consigne_min
  consigne_max: !input consigne_max
  meteo: !input meteo
  calendriers: !input calendriers
  scenarios:
    - !input scenario_1
    - !input scenario_2
    - !input scenario_3
    - !input scenario_4
    - !input scenario_5
    - !input scenario_6
  noms:
    - !input nom_1
    - !input nom_2
    - !input nom_3
    - !input nom_4
    - !input nom_5
    - !input nom_6
  icones:
    - !input icone_1
    - !input icone_2
    - !input icone_3
    - !input icone_4
    - !input icone_5
    - !input icone_6
  couleurs:
    - !input couleur_1
    - !input couleur_2
    - !input couleur_3
    - !input couleur_4
    - !input couleur_5
    - !input couleur_6
  led_reglages:
    - cle: led_mode
      valeur: !input led_mode
    - cle: led_intensite
      valeur: !input led_intensite
    - cle: led_alerte
      valeur: !input led_alerte
    - cle: ecran_intensite
      valeur: !input ecran_intensite
  # Action ESPHome du module : esphome.<nom du noeud>_maj_valeur.
  action_maj: "esphome.{{ device_attr(panneau, 'name') | slugify }}_maj_valeur"

triggers:
  - trigger: state
    entity_id: !input thermometre
  - trigger: state
    entity_id: !input thermometre_exterieur
  # Sans « to » : se déclenche aussi sur les changements d'attributs
  # (consigne, activité, préréglage, verrou).
  - trigger: state
    entity_id: !input thermostat
  - trigger: state
    id: meteo
    entity_id: !input meteo
  - trigger: state
    id: planning
    entity_id: !input calendriers
  # Aussi le passage à minuit et les événements modifiés à l'avance, qui ne
  # changent pas l'état d'un calendrier.
  - trigger: time_pattern
    id: periodique
    minutes: "/5"
  - trigger: homeassistant
    id: demarrage
    event: start
  - trigger: event
    id: demande
    event_type: esphome.hapanel_demande_valeurs
  - trigger: event
    id: commande
    event_type: esphome.hapanel_commande

conditions:
  # Une demande ou une commande ne concerne que le panneau qui l'a émise.
  - condition: template
    value_template: >-
      {{ trigger.id not in ['demande', 'commande']
         or trigger.event.data.get('device_id') == panneau }}

actions:
  - variables:
      etat: "{{ states(thermostat) }}"
      disponible: "{{ etat not in ['unavailable', 'unknown'] }}"
      verrou: "{{ state_attr(thermostat, 'is_locked') == true }}"
      # Bornes du blueprint, resserrées à celles du thermostat.
      borne_min: >-
        {{ [consigne_min | float, state_attr(thermostat, 'min_temp') | float(consigne_min)] | max }}
      borne_max: >-
        {{ [consigne_max | float, state_attr(thermostat, 'max_temp') | float(consigne_max)] | min }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'commande' }}"
        sequence:
          - variables:
              commande: "{{ trigger.event.data.get('commande', '') }}"
              valeur: "{{ trigger.event.data.get('valeur', '') }}"
          - choose:
              # Scénario : le panneau n'envoie qu'un numéro, seules les entités
              # choisies ici peuvent être lancées (D024).
              - conditions:
                  - condition: template
                    value_template: "{{ commande == 'scenario' }}"
                sequence:
                  - variables:
                      n: "{{ valeur | int(0) }}"
                      cible: "{{ (scenarios[n - 1] or '') if 1 <= n <= 6 else '' }}"
                  - if:
                      # Une scène jamais activée est « unknown » : elle reste lançable.
                      - condition: template
                        value_template: >-
                          {{ cible != '' and states[cible] is not none
                             and states(cible) != 'unavailable' }}
                    then:
                      - action: >-
                          {{ cible.split('.')[0] }}.{{ 'trigger' if cible.startswith('automation.') else 'turn_on' }}
                        target:
                          entity_id: "{{ cible }}"
                      - action: "{{ action_maj }}"
                        data:
                          cle: scen_resultat
                          valeur: ok
                    else:
                      - action: "{{ action_maj }}"
                        data:
                          cle: scen_resultat
                          valeur: refus
                      - action: system_log.write
                        data:
                          level: warning
                          logger: hapanel.blueprint
                          message: "HAPanel : scénario refusé ({{ valeur }})"
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ commande == 'chauffage_mode' and valeur in ['heat', 'off']
                         and etat in ['heat', 'off'] and etat != valeur and not verrou }}
                sequence:
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      hvac_mode: "{{ valeur }}"
              # Consigne : chauffage allumé seulement (D015).
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ commande == 'chauffage_consigne' and valeur is number
                         and etat == 'heat' and not verrou
                         and borne_min <= valeur | float <= borne_max }}
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      temperature: "{{ valeur | float }}"
              # Préréglage : chauffage allumé seulement, préréglage connu du
              # thermostat.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ commande == 'chauffage_prereglage'
                         and valeur in (state_attr(thermostat, 'preset_modes') or [])
                         and etat == 'heat' and not verrou }}
                sequence:
                  - action: climate.set_preset_mode
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      preset_mode: "{{ valeur }}"
            default:
              - action: system_log.write
                data:
                  level: warning
                  logger: hapanel.blueprint
                  message: >-
                    HAPanel : commande refusée ({{ commande }} {{ valeur }},
                    thermostat {{ etat }}, verrou {{ verrou }})
    default:
      # Accueil : tout déclencheur, sauf ceux propres à la météo et au planning.
      - if:
          - condition: template
            value_template: "{{ trigger.id not in ['meteo', 'planning'] }}"
        then:
          - repeat:
              # Liste YAML : chaque valeur est rendue en texte. Un modèle qui
              # produirait toute la liste échoue, car hvac_action est une
              # énumération que Home Assistant ne sait pas relire dans une liste.
              for_each:
                # 14 caractères au plus : le panneau lit 31 octets (accents
                # sur 2 octets).
                - cle: piece
                  valeur: >-
                    {{ (nom_piece | trim or area_name(thermometre) or 'Intérieur')[:14] }}
                - cle: temperature
                  valeur: "{{ states(thermometre) }}"
                - cle: temperature_exterieure
                  valeur: "{{ states(thermometre_exterieur) }}"
                - cle: chauffage_mode
                  valeur: "{{ etat }}"
                - cle: chauffage_action
                  valeur: >-
                    {{ (state_attr(thermostat, 'hvac_action') or 'unknown') | string
                       if disponible else 'unavailable' }}
                - cle: chauffage_consigne
                  valeur: >-
                    {{ (state_attr(thermostat, 'temperature') | string
                        if state_attr(thermostat, 'temperature') is not none else 'unknown')
                       if disponible else 'unavailable' }}
                - cle: chauffage_prereglage
                  valeur: >-
                    {{ (state_attr(thermostat, 'preset_mode') or 'none') | string
                       if disponible else 'unavailable' }}
                - cle: chauffage_verrou
                  valeur: "{{ ('on' if verrou else 'off') if disponible else 'unavailable' }}"
                - cle: consigne_min
                  valeur: "{{ borne_min }}"
                - cle: consigne_max
                  valeur: "{{ borne_max }}"
              sequence:
                - action: "{{ action_maj }}"
                  data:
                    cle: "{{ repeat.item.cle }}"
                    valeur: "{{ repeat.item.valeur }}"
      # Scénarios.
      - if:
          - condition: template
            value_template: "{{ trigger.id in ['periodique', 'demarrage', 'demande'] }}"
        then:
          - repeat:
              for_each: [0, 1, 2, 3, 4, 5]
              sequence:
                - variables:
                    i: "{{ repeat.item }}"
                    s: "{{ scenarios[i] or '' }}"
                - repeat:
                    for_each:
                      - cle: "scen_{{ i + 1 }}_icone"
                        valeur: "{{ icones[i] or 'aucune' }}"
                      - cle: "scen_{{ i + 1 }}_couleur"
                        valeur: "{{ couleurs[i] or 'bleu' }}"
                      - cle: "scen_{{ i + 1 }}_nom"
                        valeur: >-
                          {{ '-' if not s else '?' if states(s) == 'unavailable'
                             else ((noms[i] or '') | trim or state_attr(s, 'friendly_name') or s)[:24] }}
                    sequence:
                      - action: "{{ action_maj }}"
                        data:
                          cle: "{{ repeat.item.cle }}"
                          valeur: "{{ repeat.item.valeur }}"
      # Réglages du module (D027, D031) : la valeur imposée, ou « libre »
      # pour que la page Réglages sache qu'elle peut le modifier.
      - if:
          - condition: template
            value_template: "{{ trigger.id in ['periodique', 'demarrage', 'demande'] }}"
        then:
          - repeat:
              for_each: "{{ led_reglages }}"
              sequence:
                - action: "{{ action_maj }}"
                  data:
                    cle: "{{ repeat.item.cle }}"
                    valeur: >-
                      {{ 'libre' if repeat.item.valeur == 'ne_pas_imposer'
                         else repeat.item.valeur }}
      # Météo.
      - if:
          - condition: template
            value_template: "{{ trigger.id in ['meteo', 'periodique', 'demarrage', 'demande'] }}"
        then:
          # Entité indisponible : l'action échoue, le panneau reçoit « unknown » (P3).
          - action: weather.get_forecasts
            continue_on_error: true
            target:
              entity_id: "{{ meteo }}"
            data:
              type: daily
            response_variable: previsions
          - variables:
              jours: >-
                {{ previsions[meteo].forecast
                   if previsions is defined and meteo in previsions else [] }}
          # La condition d'abord : c'est elle qui donne l'état du groupe au panneau.
          - repeat:
              for_each:
                - cle: meteo_condition
                  valeur: "{{ states(meteo) }}"
                - cle: meteo_temperature
                  valeur: "{{ state_attr(meteo, 'temperature') | default('unknown', true) }}"
              sequence:
                - action: "{{ action_maj }}"
                  data:
                    cle: "{{ repeat.item.cle }}"
                    valeur: "{{ repeat.item.valeur }}"
          - repeat:
              for_each: [0, 1, 2]
              sequence:
                - variables:
                    j: "{{ repeat.item }}"
                    p: "{{ jours[j] if j < jours | length else {} }}"
                - repeat:
                    for_each:
                      # Lundi = 0 ; le jour vient de la prévision, pas de l'horloge.
                      - cle: "meteo_j{{ j + 1 }}_jour"
                        valeur: >-
                          {{ (p.datetime | as_datetime | as_local).weekday()
                             if p.datetime is defined else 'unknown' }}
                      - cle: "meteo_j{{ j + 1 }}_condition"
                        valeur: "{{ p.condition | default('unknown', true) }}"
                      - cle: "meteo_j{{ j + 1 }}_max"
                        valeur: "{{ p.temperature if p.temperature is defined and p.temperature is not none else 'unknown' }}"
                      - cle: "meteo_j{{ j + 1 }}_min"
                        valeur: "{{ p.templow if p.templow is defined and p.templow is not none else 'unknown' }}"
                    sequence:
                      - action: "{{ action_maj }}"
                        data:
                          cle: "{{ repeat.item.cle }}"
                          valeur: "{{ repeat.item.valeur }}"
      # Planning.
      - if:
          - condition: template
            value_template: "{{ trigger.id in ['planning', 'periodique', 'demarrage', 'demande'] }}"
        then:
          # Calendrier indisponible : l'action échoue, le panneau reçoit « unknown » (P3).
          - action: calendar.get_events
            continue_on_error: true
            target:
              entity_id: "{{ calendriers }}"
            data:
              start_date_time: "{{ today_at('00:00') }}"
              end_date_time: "{{ today_at('00:00') + timedelta(days=1) }}"
            response_variable: agenda
          - repeat:
              for_each: [0, 1, 2, 3]
              sequence:
                - variables:
                    i: "{{ repeat.item }}"
                    cal: "{{ calendriers[i] if i < calendriers | length else '' }}"
                    evenements: >-
                      {{ agenda[cal].events if agenda is defined and cal in agenda else none }}
                - repeat:
                    for_each:
                      # « Chauffage » est retiré : toute la page parle de chauffage.
                      - cle: "plan_{{ i + 1 }}_nom"
                        valeur: >-
                          {{ ((state_attr(cal, 'friendly_name') or cal)
                              | replace('Chauffage ', ''))[:14] if cal else '-' }}
                      # « h » puis 24 chiffres hexadécimaux, 4 quarts d'heure chacun. Le
                      # préfixe garde un texte : Home Assistant lirait sinon un nombre.
                      - cle: "plan_{{ i + 1 }}_creneaux"
                        valeur: >-
                          {%- if evenements is none -%}unknown{%- else -%}
                          {%- set minuit = today_at('00:00') -%}
                          {%- set r = namespace(texte='h') -%}
                          {%- for n in range(24) -%}
                            {%- set v = namespace(x=0) -%}
                            {%- for b in range(4) -%}
                              {%- set q = n * 4 + b -%}
                              {%- set a = namespace(actif=false) -%}
                              {%- for e in evenements -%}
                                {%- set d = ((e.start | as_datetime | as_local) - minuit).total_seconds() / 900 -%}
                                {%- set f = ((e.end | as_datetime | as_local) - minuit).total_seconds() / 900 -%}
                                {%- if d < q + 1 and f > q -%}{%- set a.actif = true -%}{%- endif -%}
                              {%- endfor -%}
                              {%- if a.actif -%}{%- set v.x = v.x + [8, 4, 2, 1][b] -%}{%- endif -%}
                            {%- endfor -%}
                            {%- set r.texte = r.texte ~ '0123456789abcdef'[v.x] -%}
                          {%- endfor -%}
                          {{- r.texte -}}
                          {%- endif -%}
                    sequence:
                      - action: "{{ action_maj }}"
                        data:
                          cle: "{{ repeat.item.cle }}"
                          valeur: "{{ repeat.item.valeur }}"
