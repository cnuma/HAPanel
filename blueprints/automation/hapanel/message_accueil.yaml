blueprint:
  name: HAPanel — message d'accueil
  description: >-
    Affiche un message d'accueil sur les panneaux HAPanel quand quelqu'un arrive :
    écran allumé 3 minutes, LED en arc-en-ciel. Une automatisation pour la
    maison. Le déclencheur (contact de porte, lumière…) ne compte qu'après une
    période sans aucun déclenchement, et seulement dans la plage horaire choisie.
    Message tiré d'une liste de tâches selon la saison et le moment de la
    journée ; une seconde liste donne des messages affichés une seule fois. Un
    panneau dont l'entité « Message d'accueil » est désactivée n'affiche rien.
    Décision D028 du dépôt cnuma/HAPanel.
  domain: automation
  source_url: https://github.com/cnuma/HAPanel/blob/main/blueprints/automation/hapanel/message_accueil.yaml
  input:
    panneaux:
      name: Panneaux
      description: Modules HAPanel qui affichent le message.
      selector:
        device:
          multiple: true
          filter:
            - integration: esphome
    declencheurs:
      name: Déclencheurs
      description: >-
        Entités qui signalent une arrivée en passant de « off » à « on » : contact
        de porte, lumière, interrupteur.
      selector:
        entity:
          multiple: true
          filter:
            - domain:
                - binary_sensor
                - light
                - switch
                - input_boolean
    inactivite:
      name: Période sans déclenchement
      description: >-
        Aucun déclencheur ne doit avoir changé pendant ce temps. Après un
        redémarrage de Home Assistant, il faut aussi attendre cette durée.
      default: 30
      selector:
        number:
          min: 5
          max: 720
          step: 5
          unit_of_measurement: min
    heure_debut:
      name: Accueil à partir de
      default: "06:00:00"
      selector:
        time:
    heure_fin:
      name: Accueil jusqu'à
      description: La plage peut passer minuit.
      default: "23:00:00"
      selector:
        time:
    liste_messages:
      name: Liste des messages
      description: >-
        Liste de tâches : chaque tâche non cochée est un message. Dans sa
        description, des mots facultatifs le réservent à une saison (printemps,
        été, automne, hiver) ou à un moment (matin, après-midi, soir, nuit). Sans
        liste ou sans message possible : « Bonjour » ou « Bonsoir », bienvenue à
        la maison.
      default: ""
      selector:
        entity:
          filter:
            - domain: todo
    liste_uniques:
      name: Liste des messages uniques
      description: >-
        Liste de tâches prioritaire : la première tâche non cochée est affichée,
        puis cochée.
      default: ""
      selector:
        entity:
          filter:
            - domain: todo
    meteo:
      name: Météo
      description: Facultatif. Température et conditions sous le message.
      default: ""
      selector:
        entity:
          filter:
            - domain: weather

# Une arrivée déclenche souvent plusieurs entités en quelques secondes.
mode: single
max_exceeded: silent

variables:
  panneaux: !input panneaux
  declencheurs: !input declencheurs
  inactivite: !input inactivite
  liste_messages: !input liste_messages
  liste_uniques: !input liste_uniques
  meteo: !input meteo

triggers:
  - trigger: state
    entity_id: !input declencheurs
    from: "off"
    to: "on"

conditions:
  - condition: time
    after: !input heure_debut
    before: !input heure_fin
  # Le déclencheur était au repos depuis la période choisie, et les autres
  # aussi : la maison était inoccupée.
  - condition: template
    value_template: >-
      {% set limite = now() - timedelta(minutes=inactivite | int) %}
      {% set autres = declencheurs | reject('eq', trigger.entity_id) | list %}
      {{ trigger.from_state.last_changed < limite
         and expand(autres) | selectattr('state', 'eq', 'on') | list | count == 0
         and expand(autres) | selectattr('last_changed', 'gt', limite) | list | count == 0 }}

actions:
  - variables:
      # Panneaux connectés dont l'accueil est activé (entité de configuration
      # « Message d'accueil », indisponible si le panneau est déconnecté).
      cibles: >-
        {% set r = namespace(l=[]) %}
        {% for p in panneaux %}
          {% set e = device_entities(p) | select('search', '^switch\..*message_d_accueil') | list %}
          {% if e and is_state(e[0], 'on') %}{% set r.l = r.l + [p] %}{% endif %}
        {% endfor %}
        {{ r.l }}
      # Saison astronomique arrondie au jour ; moments en heure locale.
      saison: >-
        {% set j = now().month * 100 + now().day %}
        {{ 'hiver' if j < 320 or j >= 1221 else 'printemps' if j < 621
           else 'ete' if j < 922 else 'automne' }}
      moment: >-
        {% set h = now().hour %}
        {{ 'nuit' if h < 5 or h >= 22 else 'matin' if h < 12
           else 'apres-midi' if h < 18 else 'soir' }}
      # Tâches non cochées des deux listes, remplies ci-dessous. L'action
      # variables d'un bloc met à jour ces variables (Home Assistant 2025.4 et
      # suivants).
      uniques: []
      messages: []
  - condition: template
    value_template: "{{ cibles | count > 0 }}"
  # Liste indisponible : l'action échoue, le message par défaut reste possible.
  - if:
      - condition: template
        value_template: "{{ liste_uniques != '' }}"
    then:
      - action: todo.get_items
        continue_on_error: true
        target:
          entity_id: "{{ liste_uniques }}"
        data:
          status: needs_action
        response_variable: reponse
      - variables:
          uniques: >-
            {{ reponse[liste_uniques]['items']
               if reponse is defined and liste_uniques in reponse else [] }}
  - if:
      - condition: template
        value_template: "{{ uniques | count == 0 and liste_messages != '' }}"
    then:
      - action: todo.get_items
        continue_on_error: true
        target:
          entity_id: "{{ liste_messages }}"
        data:
          status: needs_action
        response_variable: reponse
      - variables:
          messages: >-
            {{ reponse[liste_messages]['items']
               if reponse is defined and liste_messages in reponse else [] }}
  # Message unique d'abord, puis un message de la liste qui convient à la
  # saison et au moment, tiré au hasard.
  - variables:
      unique: "{{ uniques[0] if uniques | count > 0 else {} }}"
      texte: >-
        {% if unique %}{{ unique.summary }}{% else %}
        {% set r = namespace(l=[]) %}
        {% for it in messages %}
          {% set mots = (it.description or '') | lower | replace('é', 'e')
             | replace('è', 'e') | regex_findall('[a-z-]+') %}
          {% set s = mots | select('in', ['printemps', 'ete', 'automne', 'hiver']) | list %}
          {% set m = mots | select('in', ['matin', 'apres-midi', 'soir', 'nuit']) | list %}
          {% if (not s or saison in s) and (not m or moment in m) %}
            {% set r.l = r.l + [it.summary] %}
          {% endif %}
        {% endfor %}
        {{ r.l | random if r.l
           else ('Bonsoir' if moment in ['soir', 'nuit'] else 'Bonjour') ~ ', bienvenue à la maison !' }}
        {% endif %}
      infos: >-
        {% set noms = {'clear-night': 'nuit claire', 'cloudy': 'nuageux',
           'exceptional': 'exceptionnel', 'fog': 'brouillard', 'hail': 'grêle',
           'lightning': 'orage', 'lightning-rainy': 'orage et pluie',
           'partlycloudy': 'éclaircies', 'pouring': 'averses', 'rainy': 'pluie',
           'snowy': 'neige', 'snowy-rainy': 'neige et pluie', 'sunny': 'ensoleillé',
           'windy': 'venteux', 'windy-variant': 'vent et nuages'} %}
        {% set t = state_attr(meteo, 'temperature') if meteo else none %}
        {% if meteo and states(meteo) in noms %}Dehors : {{ (t | round(0) | int ~ ' °C, ')
           if t is number else '' }}{{ noms[states(meteo)] }}{% endif %}
  - repeat:
      for_each: "{{ cibles }}"
      sequence:
        # Action ESPHome du module : esphome.<nom du noeud>_message_accueil.
        - action: "esphome.{{ device_attr(repeat.item, 'name') | slugify }}_message_accueil"
          continue_on_error: true
          data:
            texte: "{{ texte | trim }}"
            infos: "{{ infos | trim }}"
  - if:
      - condition: template
        value_template: "{{ unique.uid is defined }}"
    then:
      - action: todo.update_item
        target:
          entity_id: "{{ liste_uniques }}"
        data:
          item: "{{ unique.uid }}"
          status: completed
