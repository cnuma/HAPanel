blueprint:
  name: Chauffage — agenda d'une pièce
  description: >-
    Applique au thermostat d'une pièce le préréglage dicté par le calendrier
    de cette pièce. Convention : le titre de l'événement en cours donne le
    préréglage (« Confort », « Éco », « Hors-gel », « Boost », sans tenir
    compte des majuscules ni des accents ; tout autre titre vaut Confort).
    Hors événement : le préréglage choisi ci-dessous (Éco par défaut).
    Présence (option, désactivée par défaut) : hors événement, un capteur de mouvement qui se
    déclenche dans la plage horaire choisie applique le préréglage de présence
    (Confort par défaut) jusqu'à une durée sans mouvement ; un événement du
    calendrier reprend toujours le dessus.
    Réappliqué à chaque début ou fin d'événement, au démarrage de Home
    Assistant et quand le chauffage est rallumé. Un réglage manuel (panneau,
    tableau de bord) tient jusqu'au prochain changement du calendrier ; la
    présence ne remplace pas un réglage manuel.
    Ne touche jamais au mode : un chauffage éteint reste éteint.
  domain: automation
  source_url: https://github.com/cnuma/HAPanel/blob/main/blueprints/automation/chauffage/agenda_piece.yaml
  input:
    calendrier:
      name: Calendrier
      description: Calendrier de la pièce (un par pièce).
      selector:
        entity:
          filter:
            - domain: calendar
    thermostat:
      name: Thermostat
      description: >-
        Thermostat de la pièce, par exemple un « Thermostat générique » de
        Home Assistant qui commande l'interrupteur du fil pilote.
      selector:
        entity:
          filter:
            - domain: climate
    hors_evenement:
      name: Hors événement
      description: Préréglage appliqué quand aucun événement n'est en cours.
      default: eco
      selector: &cle
        select:
          options:
            - label: Confort
              value: confort
            - label: Éco
              value: eco
            - label: Hors-gel
              value: hors_gel
            - label: Boost
              value: boost
    presence:
      name: Présence (option)
      description: >-
        Hors événement, chauffer la pièce quand quelqu'un y est détecté.
        Désactivée par défaut : sans l'interrupteur ci-dessous, les capteurs
        sont ignorés.
      collapsed: true
      input:
        presence_activee:
          name: Activer la présence
          description: >-
            Allumé : un mouvement hors événement applique le préréglage de
            présence. Éteint : comportement du seul calendrier.
          default: false
          selector:
            boolean: {}
        capteurs_presence:
          name: Capteurs de présence
          description: >-
            Capteurs de mouvement ou de présence de la pièce (« on » = quelqu'un
            est détecté). Un seul suffit.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        prereglage_presence:
          name: Préréglage de présence
          description: Préréglage appliqué tant qu'une présence est détectée.
          default: confort
          selector: *cle
        duree_presence:
          name: Durée après le dernier mouvement
          description: >-
            Le préréglage de présence tient encore cette durée après le dernier
            mouvement, puis le préréglage hors événement revient. Chaque
            nouveau mouvement relance la durée.
          default: 30
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
        plage_debut:
          name: Détection à partir de
          description: >-
            Début de la plage où un mouvement compte. Début égal à la fin :
            toute la journée. Une plage peut passer minuit (22:00 à 06:00).
          default: "00:00:00"
          selector:
            time: {}
        plage_fin:
          name: Détection jusqu'à
          description: >-
            Fin de la plage : à cette heure, la présence en cours s'arrête et
            le préréglage hors événement revient.
          default: "00:00:00"
          selector:
            time: {}
    correspondance:
      name: Correspondance avec le thermostat
      description: >-
        Nom du préréglage du thermostat pour chaque titre. Valeurs par défaut
        pour le Thermostat générique de Home Assistant, qui n'a ni « frost »
        ni « boost » : Hors-gel y devient « away » (Absent) et Boost
        « activity » (Activité).
      collapsed: true
      input:
        prereglage_confort:
          name: Confort
          default: comfort
          selector: &prereglage
            select:
              custom_value: true
              options: [comfort, eco, away, boost, home, sleep, activity, frost, none]
        prereglage_eco:
          name: Éco
          default: eco
          selector: *prereglage
        prereglage_hors_gel:
          name: Hors-gel
          default: away
          selector: *prereglage
        prereglage_boost:
          name: Boost
          default: activity
          selector: *prereglage

mode: queued
max: 5

trigger_variables:
  presence_activee: !input presence_activee
  capteurs_presence: !input capteurs_presence
  duree_presence: !input duree_presence

variables:
  calendrier: !input calendrier
  thermostat: !input thermostat
  hors_evenement: !input hors_evenement
  prereglage_presence: !input prereglage_presence
  plage_debut: !input plage_debut
  plage_fin: !input plage_fin
  correspondance:
    confort: !input prereglage_confort
    eco: !input prereglage_eco
    hors_gel: !input prereglage_hors_gel
    boost: !input prereglage_boost

triggers:
  # Début ou fin d'événement (changement d'état du calendrier).
  - trigger: state
    entity_id: !input calendrier
    to: ~
    id: agenda
  # Deux événements qui se suivent sans trou : l'état reste « on », le titre change.
  - trigger: state
    entity_id: !input calendrier
    attribute: message
    id: agenda
  - trigger: homeassistant
    event: start
    id: demarrage
  # Chauffage rallumé : il reprend le préréglage du moment.
  - trigger: state
    entity_id: !input thermostat
    from: "off"
    to: heat
    id: rallumage
  # Présence : un capteur passe à « on ». Toujours faux si l'option est
  # désactivée ou sans capteur choisi.
  - trigger: template
    value_template: >-
      {{ presence_activee and expand(capteurs_presence) | selectattr('state', 'eq', 'on')
         | list | count > 0 }}
    id: presence
  # Fin de présence : aucun capteur à « on » depuis la durée choisie.
  # Réévalué chaque minute (now()), donc aussi après un redémarrage.
  - trigger: template
    value_template: >-
      {% set c = expand(capteurs_presence) %}
      {{ presence_activee and c | count > 0
         and c | selectattr('state', 'eq', 'on') | list | count == 0
         and (c | map(attribute='last_changed') | max)
             < now() - timedelta(minutes=duree_presence | int) }}
    id: fin_presence
  - trigger: time
    at: !input plage_fin
    id: fin_presence

conditions:
  # Rien sur un état inconnu : calendrier ou thermostat indisponible.
  - condition: template
    value_template: >-
      {{ states(calendrier) in ['on', 'off']
         and states(thermostat) == 'heat' }}

actions:
  - variables:
      titre: >-
        {{ (state_attr(calendrier, 'message') or '') | lower
           | replace('é', 'e') | replace('è', 'e') | replace('-', ' ')
           | replace('_', ' ') | trim }}
      dans_plage: >-
        {% set d = plage_debut[:5] %}{% set f = plage_fin[:5] %}
        {% set h = now().strftime('%H:%M') %}
        {{ d == f or (d < f and d <= h and h < f)
           or (d > f and (h >= d or h < f)) }}
      # Au démarrage, l'horodatage des capteurs est remis à zéro : seul un
      # capteur à « on » compte.
      present: >-
        {% set c = expand(capteurs_presence) %}
        {{ presence_activee and c | count > 0 and dans_plage
           and (c | selectattr('state', 'eq', 'on') | list | count > 0
                or (trigger.id != 'demarrage'
                    and (c | map(attribute='last_changed') | max)
                        >= now() - timedelta(minutes=duree_presence | int))) }}
      cle: >-
        {% if states(calendrier) == 'on' %}
          {% if titre.startswith('hors gel') or titre.startswith('horsgel') %}hors_gel
          {% elif titre.startswith('eco') %}eco
          {% elif titre.startswith('boost') %}boost
          {% else %}confort{% endif %}
        {% elif present %}{{ prereglage_presence }}
        {% else %}{{ hors_evenement }}{% endif %}
      prereglage: "{{ correspondance[cle | trim] }}"
      connus: "{{ state_attr(thermostat, 'preset_modes') or [] }}"
  # Présence : seulement hors événement, et sans écraser un réglage manuel
  # (le préréglage actuel doit être celui de hors événement ou de présence).
  - condition: template
    value_template: >-
      {{ trigger.id not in ['presence', 'fin_presence']
         or (presence_activee and states(calendrier) != 'on'
             and state_attr(thermostat, 'preset_mode') in
                 [correspondance[hors_evenement], correspondance[prereglage_presence]]) }}
  - if:
      - condition: template
        value_template: "{{ prereglage in connus }}"
    then:
      - if:
          - condition: template
            value_template: "{{ state_attr(thermostat, 'preset_mode') != prereglage }}"
        then:
          - action: climate.set_preset_mode
            target:
              entity_id: "{{ thermostat }}"
            data:
              preset_mode: "{{ prereglage }}"
    else:
      - action: system_log.write
        data:
          level: warning
          logger: chauffage.agenda
          message: >-
            Chauffage : préréglage « {{ prereglage }} » inconnu de {{ thermostat }}
            (connus : {{ connus | join(', ') }})
