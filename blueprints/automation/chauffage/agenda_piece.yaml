blueprint:
  name: Chauffage et clim — agenda d'une pièce
  description: >-
    Pilote le radiateur ou la clim d'une pièce selon le calendrier de cette
    pièce. Le titre de l'événement en cours se lit dans cet ordre, sans tenir
    compte des majuscules ni des accents : un mode facultatif (« Chaud »,
    « Froid », « Arrêt »), un mot-clé facultatif (« Confort », « Éco »,
    « Hors-gel », « Boost » ; sans mot-clé : Confort) et une consigne
    facultative (« Froid 25 », « Chaud 21,5 », « 19 »). Sans mode dans le
    titre, le mode de l'appareil ne change pas, et un appareil éteint reste
    éteint. Sans température dans le titre, le mot-clé applique un préréglage
    de l'appareil (plutôt radiateur) ou une température fixée ici, série chaud
    ou froid (plutôt clim), selon le choix « Comment appliquer ».
    Hors événement : le réglage choisi ci-dessous (Éco par défaut, ou Arrêt).
    Présence (option, désactivée par défaut) : hors événement, un déclencheur
    à « on » dans la plage horaire choisie applique le réglage de présence
    jusqu'à une durée sans mouvement ; un événement du calendrier reprend
    toujours le dessus.
    Réappliqué à chaque début ou fin d'événement, au démarrage de Home
    Assistant et à chaque changement de mode de l'appareil. Un réglage manuel
    (panneau, tableau de bord) tient jusqu'au prochain changement du
    calendrier ; la présence ne remplace pas un réglage manuel.
  domain: automation
  source_url: https://github.com/cnuma/HAPanel/blob/main/blueprints/automation/chauffage/agenda_piece.yaml
  input:
    calendrier:
      name: Calendrier
      description: Calendrier de la pièce (un par pièce).
      selector:
        entity:
          filter:
            - domain: calendar
    thermostat:
      name: Thermostat ou clim
      description: >-
        Entité « climate » de la pièce : par exemple un « Thermostat générique »
        de Home Assistant qui commande l'interrupteur du fil pilote, ou une clim.
      selector:
        entity:
          filter:
            - domain: climate
    methode:
      name: Comment appliquer Confort, Éco, Hors-gel, Boost
      description: >-
        Quand le titre ne donne pas de température. « Préréglages de
        l'appareil » : l'appareil a ses propres Confort, Éco… avec leurs
        températures (thermostat générique des radiateurs, certaines clims ;
        voir son attribut preset_modes). « Températures fixées ici » : le
        blueprint envoie la température de la section du même nom, série chaud
        ou froid selon le mode (clim sans préréglage).
      default: prereglage
      selector:
        select:
          options:
            - label: Préréglages de l'appareil (plutôt radiateur)
              value: prereglage
            - label: Températures fixées ici (plutôt clim)
              value: consigne
    hors_evenement:
      name: Hors événement
      description: >-
        Réglage appliqué quand aucun événement n'est en cours. Arrêt : l'appareil
        est éteint ; un événement suivant ne le rallume que si son titre commence
        par « Chaud » ou « Froid ».
      default: eco
      selector:
        select:
          options:
            - label: Confort
              value: confort
            - label: Éco
              value: eco
            - label: Hors-gel
              value: hors_gel
            - label: Boost
              value: boost
            - label: Arrêt
              value: arret
    presence:
      name: Présence (option)
      description: >-
        Hors événement, chauffer ou rafraîchir la pièce quand quelqu'un y est
        détecté. Désactivée par défaut : sans l'interrupteur ci-dessous, les
        déclencheurs sont ignorés. La présence ne rallume jamais un appareil
        éteint.
      collapsed: true
      input:
        presence_activee:
          name: Activer la présence
          description: >-
            Allumé : un mouvement hors événement applique le réglage de
            présence. Éteint : comportement du seul calendrier.
          default: false
          selector:
            boolean: {}
        capteurs_presence:
          name: Déclencheurs de présence
          description: >-
            Un ou plusieurs déclencheurs de la pièce, à « on » quand quelqu'un
            est là : capteurs de mouvement, de présence ou d'ouverture, lumière,
            prise ou interrupteur, entrée booléenne. Un seul à « on » suffit ; la
            durée part du dernier changement de l'un d'eux.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: light
                - domain: switch
                - domain: input_boolean
                - domain: fan
        prereglage_presence:
          name: Réglage de présence
          description: Mot-clé appliqué tant qu'une présence est détectée.
          default: confort
          selector:
            select:
              options:
                - label: Confort
                  value: confort
                - label: Éco
                  value: eco
                - label: Hors-gel
                  value: hors_gel
                - label: Boost
                  value: boost
        duree_presence:
          name: Durée après le dernier mouvement
          description: >-
            Le réglage de présence tient encore cette durée après le dernier
            mouvement, puis le réglage hors événement revient. Chaque nouveau
            mouvement relance la durée.
          default: 30
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
        plage_debut:
          name: Détection à partir de
          description: >-
            Début de la plage où un mouvement compte. Début égal à la fin :
            toute la journée. Une plage peut passer minuit (22:00 à 06:00).
          default: "00:00:00"
          selector:
            time: {}
        plage_fin:
          name: Détection jusqu'à
          description: >-
            Fin de la plage : à cette heure, la présence en cours s'arrête et
            le réglage hors événement revient.
          default: "00:00:00"
          selector:
            time: {}
    correspondance:
      name: Préréglages de l'appareil (noms)
      description: >-
        Ignorée avec « Températures fixées ici ». Nom du préréglage de
        l'appareil pour chaque mot-clé. Valeurs par défaut
        pour le Thermostat générique de Home Assistant, qui n'a ni « frost »
        ni « boost » : Hors-gel y devient « away » (Absent) et Boost
        « activity » (Activité).
      collapsed: true
      input:
        prereglage_confort:
          name: Confort
          default: comfort
          selector: &prereglage
            select:
              custom_value: true
              options: [comfort, eco, away, boost, home, sleep, activity, frost, none]
        prereglage_eco:
          name: Éco
          default: eco
          selector: *prereglage
        prereglage_hors_gel:
          name: Hors-gel
          default: away
          selector: *prereglage
        prereglage_boost:
          name: Boost
          default: activity
          selector: *prereglage
    consignes:
      name: Températures fixées ici
      description: >-
        Ignorée avec « Préréglages de l'appareil » (une température écrite dans
        le titre s'applique dans les deux cas). Température de chaque mot-clé, série chaud (modes chaud et auto) et
        série froid (mode froid). En mode auto à deux bornes, la série chaud
        donne la borne basse et la série froid la borne haute. Bornées au
        minimum et au maximum de l'appareil.
      collapsed: true
      input:
        chaud_confort:
          name: Chaud — Confort
          default: 20
          selector: &temperature
            number:
              min: 5
              max: 35
              step: 0.5
              unit_of_measurement: °C
        chaud_eco:
          name: Chaud — Éco
          default: 17
          selector: *temperature
        chaud_hors_gel:
          name: Chaud — Hors-gel
          default: 7
          selector: *temperature
        chaud_boost:
          name: Chaud — Boost
          default: 23
          selector: *temperature
        froid_confort:
          name: Froid — Confort
          default: 25
          selector: *temperature
        froid_eco:
          name: Froid — Éco
          default: 28
          selector: *temperature
        froid_hors_gel:
          name: Froid — Hors-gel (presque pas de froid)
          default: 32
          selector: *temperature
        froid_boost:
          name: Froid — Boost
          default: 22
          selector: *temperature

mode: queued
max: 5

trigger_variables:
  presence_activee: !input presence_activee
  capteurs_presence: !input capteurs_presence
  duree_presence: !input duree_presence

variables:
  calendrier: !input calendrier
  thermostat: !input thermostat
  methode: !input methode
  hors_evenement: !input hors_evenement
  prereglage_presence: !input prereglage_presence
  plage_debut: !input plage_debut
  plage_fin: !input plage_fin
  correspondance:
    confort: !input prereglage_confort
    eco: !input prereglage_eco
    hors_gel: !input prereglage_hors_gel
    boost: !input prereglage_boost
  consignes:
    chaud:
      confort: !input chaud_confort
      eco: !input chaud_eco
      hors_gel: !input chaud_hors_gel
      boost: !input chaud_boost
    froid:
      confort: !input froid_confort
      eco: !input froid_eco
      hors_gel: !input froid_hors_gel
      boost: !input froid_boost
  modes_actifs: [heat, cool, heat_cool, auto]

triggers:
  # Début ou fin d'événement (changement d'état du calendrier).
  - trigger: state
    entity_id: !input calendrier
    to: ~
    id: agenda
  # Deux événements qui se suivent sans trou : l'état reste « on », le titre change.
  - trigger: state
    entity_id: !input calendrier
    attribute: message
    id: agenda
  - trigger: homeassistant
    event: start
    id: demarrage
  # Changement de mode de l'appareil (rallumage, passage chaud ↔ froid) :
  # le réglage du moment est réappliqué dans le nouveau mode, sans le changer.
  - trigger: state
    entity_id: !input thermostat
    to: ~
    id: mode
  # Présence : un déclencheur passe à « on ». Toujours faux si l'option est
  # désactivée ou sans déclencheur choisi.
  - trigger: template
    value_template: >-
      {{ presence_activee and expand(capteurs_presence)
         | selectattr('state', 'eq', 'on') | list | count > 0 }}
    id: presence
  # Fin de présence : aucun déclencheur à « on » depuis la durée choisie.
  # Réévalué chaque minute (now()), donc aussi après un redémarrage.
  - trigger: template
    value_template: >-
      {% set c = expand(capteurs_presence) %}
      {{ presence_activee and c | count > 0
         and c | selectattr('state', 'eq', 'on') | list | count == 0
         and (c | map(attribute='last_changed') | max)
             < now() - timedelta(minutes=duree_presence | int) }}
    id: fin_presence
  - trigger: time
    at: !input plage_fin
    id: fin_presence

conditions:
  # Rien sur un état inconnu : calendrier ou appareil indisponible.
  - condition: template
    value_template: >-
      {{ states(calendrier) in ['on', 'off']
         and states(thermostat) not in ['unavailable', 'unknown'] }}

actions:
  - variables:
      evenement: "{{ states(calendrier) == 'on' }}"
      titre: >-
        {% set ns = namespace(t=(state_attr(calendrier, 'message') or '') | lower) %}
        {% for a, b in [('é','e'),('è','e'),('ê','e'),('ë','e'),('à','a'),('â','a'),
                        ('î','i'),('ï','i'),('ô','o'),('ù','u'),('û','u'),('ç','c'),
                        ('°c',' '),('°',' '),('-',' '),('_',' '),(',','.')] %}
          {% set ns.t = ns.t | replace(a, b) %}
        {% endfor %}
        {{ ns.t | trim }}
      mots: "{{ (titre | string).split() if evenement else [] }}"
      mot_mode: >-
        {{ mots[0] if mots | count > 0 and mots[0] in ['chaud', 'froid', 'arret'] else '' }}
      reste: "{{ (mots[1:] if mot_mode else mots) | map('string') | join(' ') }}"
      # Consigne(s) du titre : le premier nombre ; en mode auto à deux bornes,
      # un second nombre donne la borne haute (« Confort 20 25 »).
      nombres: "{{ reste | string | regex_findall('[0-9]+(?:[.][0-9]+)?') | map('float') | list }}"
      nombre: "{{ nombres[0] if nombres | count > 0 else none }}"
      dans_plage: >-
        {% set d = plage_debut[:5] %}{% set f = plage_fin[:5] %}
        {% set h = now().strftime('%H:%M') %}
        {{ d == f or (d < f and d <= h and h < f)
           or (d > f and (h >= d or h < f)) }}
      # Au démarrage, l'horodatage des déclencheurs est remis à zéro : seul un
      # déclencheur à « on » compte.
      present: >-
        {% set c = expand(capteurs_presence) %}
        {{ presence_activee and c | count > 0 and dans_plage
           and (c | selectattr('state', 'eq', 'on') | list | count > 0
                or (trigger.id != 'demarrage'
                    and (c | map(attribute='last_changed') | max)
                        >= now() - timedelta(minutes=duree_presence | int))) }}
      cle: >-
        {% if evenement %}
          {% set r = reste | string %}
          {% if r.startswith('hors gel') or r.startswith('horsgel') %}hors_gel
          {% elif r.startswith('eco') %}eco
          {% elif r.startswith('boost') %}boost
          {% else %}confort{% endif %}
        {% elif present %}{{ prereglage_presence }}
        {% else %}{{ hors_evenement }}{% endif %}
      mode_actuel: "{{ states(thermostat) }}"
      # Mode voulu par le calendrier ; jamais changé sur un changement de mode
      # fait à la main (déclencheur « mode »).
      mode_voulu: >-
        {% set m = {'chaud': 'heat', 'froid': 'cool', 'arret': 'off'} %}
        {% if mot_mode %}{{ m[mot_mode] }}
        {% elif not evenement and cle | trim == 'arret' %}off
        {% else %}{{ mode_actuel }}{% endif %}
      mode_cible: "{{ mode_actuel if trigger.id == 'mode' else mode_voulu }}"
  # Mode changé à la main contre le titre en cours (ex. chaud pendant un
  # « Froid 25 ») ou appareil laissé éteint : rien.
  - condition: template
    value_template: >-
      {{ mode_voulu == mode_actuel or trigger.id != 'mode' }}
  # Présence : seulement hors événement, et sans écraser un réglage manuel.
  - condition: template
    value_template: >-
      {% set k = [hors_evenement, prereglage_presence] | reject('eq', 'arret') | list %}
      {% if trigger.id not in ['presence', 'fin_presence'] %}true
      {% elif not presence_activee or evenement or mode_actuel not in modes_actifs %}false
      {% elif methode == 'prereglage' %}
        {% set ns = namespace(p=[]) %}
        {% for x in k %}{% set ns.p = ns.p + [correspondance[x]] %}{% endfor %}
        {{ state_attr(thermostat, 'preset_mode') in ns.p }}
      {% else %}
        {% set s = 'froid' if mode_actuel == 'cool' else 'chaud' %}
        {% set lo = state_attr(thermostat, 'min_temp') | float(7) %}
        {% set hi = state_attr(thermostat, 'max_temp') | float(35) %}
        {% set ns = namespace(ok=false) %}
        {% for x in k %}
          {% set v = [[consignes[s][x] | float, lo] | max, hi] | min %}
          {% if state_attr(thermostat, 'temperature') is not none
                and state_attr(thermostat, 'temperature') | float == v %}{% set ns.ok = true %}{% endif %}
          {% if state_attr(thermostat, 'target_temp_low') is not none
                and state_attr(thermostat, 'target_temp_low') | float
                    == [[consignes.chaud[x] | float, lo] | max, hi] | min %}{% set ns.ok = true %}{% endif %}
        {% endfor %}
        {{ ns.ok }}
      {% endif %}
  # Rien à faire : appareil éteint (ou en déshumidification, ventilation) et
  # aucun mode demandé.
  - condition: template
    value_template: "{{ mode_cible != mode_actuel or mode_actuel in modes_actifs }}"
  - if:
      - condition: template
        value_template: "{{ mode_cible != mode_actuel }}"
    then:
      - if:
          - condition: template
            value_template: "{{ mode_cible in (state_attr(thermostat, 'hvac_modes') or []) }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "{{ mode_cible }}"
          - wait_template: "{{ states(thermostat) == mode_cible }}"
            timeout: "00:00:10"
        else:
          - action: system_log.write
            data:
              level: warning
              logger: chauffage.agenda
              message: >-
                Chauffage : mode « {{ mode_cible }} » inconnu de {{ thermostat }}
                (connus : {{ (state_attr(thermostat, 'hvac_modes') or []) | join(', ') }})
          - stop: Mode inconnu
  - condition: template
    value_template: "{{ mode_cible in modes_actifs }}"
  # Valeurs relues après un éventuel changement de mode.
  - variables:
      serie: "{{ 'froid' if mode_cible == 'cool' else 'chaud' }}"
      tmin: "{{ state_attr(thermostat, 'min_temp') | float(7) }}"
      tmax: "{{ state_attr(thermostat, 'max_temp') | float(35) }}"
      deux_bornes: >-
        {{ state_attr(thermostat, 'target_temp_low') is not none
           and state_attr(thermostat, 'target_temp_high') is not none
           and state_attr(thermostat, 'temperature') is none }}
      connus: "{{ state_attr(thermostat, 'preset_modes') or [] }}"
      prereglage: "{{ correspondance[cle | trim] }}"
      par_consigne: "{{ nombre is not none or methode == 'consigne' }}"
      consigne: >-
        {% set v = nombre if nombre is not none else consignes[serie][cle | trim] %}
        {{ [[v | float, tmin | float] | max, tmax | float] | min }}
      borne_basse: >-
        {% set v = nombre if nombre is not none else consignes.chaud[cle | trim] %}
        {{ [[v | float, tmin | float] | max, tmax | float] | min }}
      borne_haute: >-
        {% set v = nombres[1] if nombres | count > 1 else consignes.froid[cle | trim] %}
        {{ [[[v | float, borne_basse | float] | max, tmin | float] | max, tmax | float] | min }}
  - choose:
      # Température (du titre ou de la section « Températures fixées ici »).
      - conditions:
          - condition: template
            value_template: "{{ par_consigne }}"
        sequence:
          # Un préréglage actif reprendrait la main sur la consigne.
          - if:
              - condition: template
                value_template: >-
                  {{ state_attr(thermostat, 'preset_mode') not in [none, 'none']
                     and 'none' in connus }}
            then:
              - action: climate.set_preset_mode
                target:
                  entity_id: "{{ thermostat }}"
                data:
                  preset_mode: none
          - if:
              - condition: template
                value_template: "{{ deux_bornes }}"
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {{ state_attr(thermostat, 'target_temp_low') | float != borne_basse | float
                         or state_attr(thermostat, 'target_temp_high') | float != borne_haute | float }}
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      target_temp_low: "{{ borne_basse }}"
                      target_temp_high: "{{ borne_haute }}"
            else:
              - if:
                  - condition: template
                    value_template: >-
                      {{ state_attr(thermostat, 'temperature') is none
                         or state_attr(thermostat, 'temperature') | float != consigne | float }}
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ thermostat }}"
                    data:
                      temperature: "{{ consigne }}"
    # Préréglage.
    default:
      - if:
          - condition: template
            value_template: "{{ prereglage in connus }}"
        then:
          - if:
              - condition: template
                value_template: "{{ state_attr(thermostat, 'preset_mode') != prereglage }}"
            then:
              - action: climate.set_preset_mode
                target:
                  entity_id: "{{ thermostat }}"
                data:
                  preset_mode: "{{ prereglage }}"
        else:
          - action: system_log.write
            data:
              level: warning
              logger: chauffage.agenda
              message: >-
                Chauffage : préréglage « {{ prereglage }} » inconnu de {{ thermostat }}
                (connus : {{ connus | join(', ') }})
