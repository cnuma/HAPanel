# HAPanel : configuration du panneau de banc. Production + composant debug
# (memoire libre, plus grand bloc libre) et journaux DEBUG.
substitutions:
  log_level: DEBUG

packages:
  production: !include hapanel.yaml

# Dossier de compilation propre au banc : passer de la production au banc ne
# recompile plus tout (environ 10 min sinon). Chemin compte depuis .esphome :
# .esphome/build/hapanel_banc, ignore par Git.
esphome:
  build_path: build/hapanel_banc
  # Diagnostic provisoire (cahier I11) : journalise toute zone envoyee a l'ecran
  # qui touche la premiere ou la derniere ligne, pour savoir si la ligne
  # parasite du haut vient d'un dessin au bord.
  on_boot:
    priority: -200
    then:
      - lambda: |-
          lv_display_add_event_cb(lv_display_get_default(), [](lv_event_t *e) {
            static uint32_t n = 0;
            if (++n % 100 == 0) ESP_LOGI("hapanel.diag", "%u envois", (unsigned) n);
            auto *a = static_cast<lv_area_t *>(lv_event_get_param(e));
            if (a != nullptr && (a->y1 <= 1 || a->y2 >= 318 || a->x2 >= 239 || a->x1 < 0 || a->y1 < 0))
              ESP_LOGI("hapanel.diag", "envoi %d,%d - %d,%d", a->x1, a->y1, a->x2, a->y2);
          }, LV_EVENT_FLUSH_START, nullptr);

debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      id: banc_memoire_libre
      name: "Mémoire libre"
    block:
      id: banc_plus_grand_bloc
      name: "Plus grand bloc libre"

# Banc : journalise chaque toucher pour verifier que les coordonnees du
# tactile correspondent a l'ecran (haut-gauche ~ 0,0 ; bas-droit ~ 240,320).
touchscreen:
  - id: !extend tactile
    on_touch:
      - lambda: |-
          ESP_LOGI("hapanel.banc", "toucher x=%d y=%d", touch.x, touch.y);
