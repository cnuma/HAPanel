# Publication des binaires publics (D038, D039, D041, D048) : compile une
# configuration publique par carte, sans aucun secret, et publie une Release
# GitHub avec, pour chaque carte, le binaire complet (premiere installation), le
# binaire de mise a jour et le manifeste lu par l'entite « Firmware » des modules.
#
# Noms des fichiers : hapanel-<carte>-factory.bin, hapanel-<carte>-ota.bin. Le
# manifeste de la S024C garde le nom manifest.json : son adresse est compilee
# dans les modules deja installes (hapanel_public.yaml).
#
# Declenche par l'envoi d'une etiquette v<version>, par exemple v0.8.0-dev.1 :
# la version doit commencer par le contenu du fichier VERSION (G5).
name: Publication

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version et SHA
        id: id
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="$(head -n 1 VERSION | tr -d '[:space:]')"
          case "$version" in
            "$base"*) ;;
            *) echo "Etiquette $GITHUB_REF_NAME hors de VERSION ($base)"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: ESPHome
        run: pip install -r requirements.txt

      - name: Compilation
        run: |
          for c in hapanel_public.yaml hapanel_2432s028_public.yaml hapanel_jc4827w543_public.yaml; do
            esphome -s version "${{ steps.id.outputs.version }}"               -s git_sha "${{ steps.id.outputs.sha }}" compile "$c"
          done

      - name: Binaires et manifestes
        run: |
          v="${{ steps.id.outputs.version }}"
          base="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME"
          mkdir publication
          # Resume affiche par le module et par HA (D047) : ligne de NOUVEAUTES.md
          # sous « ## <version> », sinon sous la version sans suffixe
          # (0.11.0-dev.1 -> 0.11.0) ; echappee pour le JSON.
          lire_resume() {
            awk -v t="## $1" '$0==t{f=1;next} f&&/^## /{exit} f&&NF{print;exit}' NOUVEAUTES.md
          }
          resume="$(lire_resume "$v")"
          [ -n "$resume" ] || resume="$(lire_resume "${v%%-*}")"
          [ -n "$resume" ] || echo "::warning::NOUVEAUTES.md : aucune ligne pour $v"
          resume="${resume//\\/\\\\}"
          resume="${resume//\"/\\\"}"
          # publier <dossier de compilation> <carte> <manifeste> <puce>
          # La puce (chipFamily) doit valoir celle du module : ESPHome n'installe
          # que la ligne de sa propre puce (ESP32 ou ESP32-S3, D048).
          publier() {
            d=".esphome/build/$1/build"
            cp "$d/firmware.factory.bin" "publication/hapanel-$2-factory.bin"
            cp "$d/firmware.ota.bin" "publication/hapanel-$2-ota.bin"
            md5="$(md5sum "publication/hapanel-$2-ota.bin" | cut -d' ' -f1)"
            # Binaire designe par son etiquette, pas par la derniere Release : une
            # publication entre la verification et l'installation ne change pas
            # le fichier telecharge (MD5 refuse sinon).
            cat > "publication/$3" <<EOF
          {
            "name": "HAPanel",
            "version": "$v",
            "home_assistant_domain": "esphome",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "$4",
                "ota": {
                  "path": "$base/hapanel-$2-ota.bin",
                  "md5": "$md5",
                  "summary": "$resume",
                  "release_url": "https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME"
                },
                "parts": [{ "path": "hapanel-$2-factory.bin", "offset": 0 }]
              }
            ]
          }
          EOF
            cat "publication/$3"
          }
          publier hapanel_public 2432s024c manifest.json ESP32
          publier hapanel_2432s028_public 2432s028 manifest-2432s028.json ESP32
          publier hapanel_jc4827w543_public jc4827w543 manifest-jc4827w543.json ESP32-S3

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" publication/*
          --title "HAPanel ${{ steps.id.outputs.version }}"
          --notes "Binaires publics sans secret (D039, D041). Premiere installation : hapanel-2432s024c-factory.bin (ecran 2,4 pouces capacitif), hapanel-2432s028-factory.bin (2,8 pouces resistif) ou hapanel-jc4827w543-factory.bin (Guition 4,3 pouces, ESP32-S3). Mise a jour : depuis le module (Menu, Mise a jour) ou entite Firmware dans Home Assistant."
          --latest
