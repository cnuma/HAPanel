      bg_color: 0x000000
      # Titre dans la barre d'etat (D036) ; contenu sous la barre (y >= 38).
      on_load:
        - lvgl.label.update:
            id: lbl_barre_titre
            text: "Planning"
      widgets:
        - label:
            id: lbl_pla_titre
            align: TOP_LEFT
            x: 12
            y: 38
            text: "Aujourd'hui"
        # Heure, ou etat de la page. Largeur fixe : voir la regle des labels
        # alignes a droite (04).
        - label:
            id: lbl_pla_etat
            align: TOP_RIGHT
            x: -12
            y: 38
            width: 130
            text_align: RIGHT
            text_color: 0x9E9E9E
            text: ""
        # Calendrier principal : nom, resume, frise et echelle.
        - label:
            id: lbl_pla_nom_1
            align: TOP_LEFT
            x: 12
            y: 66
            width: 216
            text_color: 0x9E9E9E
            hidden: true
            text: ""
        - label:
            id: lbl_pla_resume
            align: TOP_LEFT
            x: 12
            y: 88
            width: 216
            text_font: police_titre
            hidden: true
            text: ""
        - obj:
            id: obj_pla_bande
            align: TOP_LEFT
            x: 12
            y: 122
            width: 216
            height: 18
            radius: 6
            border_width: 0
            pad_all: 0
            bg_color: 0x303030
            scrollable: false
            clickable: false
            hidden: true
        - label:
            id: lbl_pla_h0
