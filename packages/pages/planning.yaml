# Ecran planning (D020) : resume et frise du jour du premier calendrier, puis une
# ligne par calendrier suivant (3 au plus), au quart d'heure. Valeurs recues par
# packages/liaison_ha.yaml, poussees par le blueprint
# blueprints/automation/hapanel/module.yaml. Aucune commande.
esphome:
  # Sans HA au demarrage, aucun changement de connexion n'appelle le
  # rafraichissement.
  on_boot:
    priority: -100
    then:
      - script.execute: planning_rafraichir

lvgl:
