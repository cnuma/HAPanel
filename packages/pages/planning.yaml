script:
  # Redessine l'ecran planning depuis les valeurs recues et l'heure de Home
  # Assistant. Appele a chaque valeur recue, a chaque changement de connexion, a
  # la peremption et toutes les 30 s. Les segments de la frise ne sont recrees
  # que si les creneaux ont change (G6).
  - id: planning_rafraichir
    then:
      - lambda: |-
          static std::string trace;
          const uint32_t ORANGE = 0xFF9800, GRIS = 0x9E9E9E, BLANC = 0xFFFFFF;
          auto montrer = [](lv_obj_t *w, bool oui) {
            if (oui) lv_obj_remove_flag(w, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);
          };
          // « h » puis 24 chiffres hexadecimaux : 4 quarts d'heure chacun.
          auto actif = [](const std::string &hex, int q) -> bool {
            if (q < 0 || q >= 96) return false;
            char c = hex[1 + q / 4];
            int n = c <= '9' ? c - '0' : (c | 0x20) - 'a' + 10;
            return n & (8 >> (q % 4));
          };
          // Creneau en cours, sinon suivant : false s'il n'y en a plus.
          auto creneau = [&actif](const std::string &hex, int q, int &debut, int &fin) -> bool {
            debut = q;
            while (debut < 96 && !actif(hex, debut)) debut++;
            if (debut >= 96) return false;
            if (debut == q) while (debut > 0 && actif(hex, debut - 1)) debut--;
            fin = q > debut ? q : debut;
            while (fin < 96 && actif(hex, fin)) fin++;
            return true;
          };

          auto t = id(heure_ha).now();
          bool heure_ok = t.is_valid();
          int q = heure_ok ? (t.hour * 60 + t.minute) / 15 : 0;

          // Connexion toujours visible (P2), puis etat des valeurs (P3), sinon
          // l'heure.
          int e = id(liaison_planning_etat);
          char texte[48];
          const char *etat = id(ha_connecte_affiche) != 1 ? "HA non connecté"
                             : e == 3 ? "périmé" : e == 0 ? "non reçu" : "";
          if (etat[0] == '\0' && heure_ok) snprintf(texte, sizeof(texte), "%02d:%02d", t.hour, t.minute);
          else snprintf(texte, sizeof(texte), "%s", etat);
          lv_label_set_text(id(lbl_pla_etat), texte);
          lv_obj_set_style_text_color(id(lbl_pla_etat), lv_color_hex(etat[0] ? ORANGE : GRIS), 0);

          // Calendrier principal.
          const std::string &nom = id(liaison_planning_nom)[0];
          const std::string &hex = id(liaison_planning_creneaux)[0];
          bool principal = e == 1 && !nom.empty() && nom != "-";
          bool valide = hex.size() == 25;
          lv_obj_t *cadre[] = {id(lbl_pla_nom_1), id(lbl_pla_resume), id(obj_pla_bande), id(lbl_pla_h0),
                               id(lbl_pla_h6), id(lbl_pla_h12), id(lbl_pla_h18), id(lbl_pla_h24)};
          for (auto *w : cadre) montrer(w, principal);
          lv_label_set_text(id(lbl_pla_nom_1), nom.c_str());

          uint32_t couleur = GRIS;
          if (hex == "?") {
            snprintf(texte, sizeof(texte), "Indisponible");
            couleur = ORANGE;
          } else if (!valide) {
            snprintf(texte, sizeof(texte), "Non reçu");
            couleur = ORANGE;
          } else if (!heure_ok) {
            snprintf(texte, sizeof(texte), "Heure non reçue");
            couleur = ORANGE;
          } else {
            int debut, fin;
            if (!creneau(hex, q, debut, fin)) {
              snprintf(texte, sizeof(texte), "Plus rien aujourd'hui");
            } else if (debut <= q) {
              snprintf(texte, sizeof(texte), "Prévu jusqu'à %02d:%02d", fin / 4, fin % 4 * 15);
              couleur = ORANGE;
            } else {
              snprintf(texte, sizeof(texte), "Prochain à %02d:%02d", debut / 4, debut % 4 * 15);
              couleur = BLANC;
            }
          }
          lv_label_set_text(id(lbl_pla_resume), texte);
          lv_obj_set_style_text_color(id(lbl_pla_resume), lv_color_hex(couleur), 0);

          if (hex != trace) {
            trace = hex;
            lv_obj_clean(id(obj_pla_bande));
            if (valide) {
              int debut = -1;
              for (int i = 0; i <= 96; i++) {
                bool a = actif(hex, i);
                if (a && debut < 0) debut = i;
                if (!a && debut >= 0) {
                  // 216 pixels pour 96 quarts d'heure.
                  int x = debut * 9 / 4;
                  lv_obj_t *segment = lv_obj_create(id(obj_pla_bande));
                  lv_obj_remove_style_all(segment);
                  lv_obj_remove_flag(segment, LV_OBJ_FLAG_CLICKABLE);
                  lv_obj_set_pos(segment, x, 0);
                  lv_obj_set_size(segment, i * 9 / 4 - x, 18);
                  lv_obj_set_style_radius(segment, 6, 0);
                  lv_obj_set_style_bg_color(segment, lv_color_hex(ORANGE), 0);
                  lv_obj_set_style_bg_opa(segment, LV_OPA_COVER, 0);
                  debut = -1;
                }
              }
            }
          }
          lv_obj_set_x(id(obj_pla_maintenant), 12 + (heure_ok ? (t.hour * 60 + t.minute) * 3 / 20 : 0));
          montrer(id(obj_pla_maintenant), principal && valide && heure_ok);

          // Calendriers suivants.
          lv_obj_t *points[] = {id(obj_pla_point_2), id(obj_pla_point_3), id(obj_pla_point_4)};
          lv_obj_t *noms[] = {id(lbl_pla_nom_2), id(lbl_pla_nom_3), id(lbl_pla_nom_4)};
          lv_obj_t *horaires[] = {id(lbl_pla_horaire_2), id(lbl_pla_horaire_3), id(lbl_pla_horaire_4)};
          for (int r = 0; r < 3; r++) {
            const std::string &n = id(liaison_planning_nom)[r + 1];
            const std::string &h = id(liaison_planning_creneaux)[r + 1];
            bool visible = e == 1 && !n.empty() && n != "-";
            montrer(points[r], visible);
            montrer(noms[r], visible);
            montrer(horaires[r], visible);
            lv_label_set_text(noms[r], n.c_str());
            bool en_cours = false;
            couleur = GRIS;
            if (h.size() != 25) {
              snprintf(texte, sizeof(texte), "%s", h == "?" ? "indisponible" : "non reçu");
              couleur = ORANGE;
            } else if (!heure_ok) {
              snprintf(texte, sizeof(texte), "--:--");
            } else {
              int debut, fin;
              if (creneau(h, q, debut, fin)) {
                snprintf(texte, sizeof(texte), "%02d:%02d - %02d:%02d", debut / 4, debut % 4 * 15, fin / 4, fin % 4 * 15);
                en_cours = debut <= q;
                if (en_cours) couleur = ORANGE;
              } else {
                snprintf(texte, sizeof(texte), "terminé");
              }
            }
            lv_label_set_text(horaires[r], texte);
            lv_obj_set_style_text_color(horaires[r], lv_color_hex(couleur), 0);
            lv_obj_set_style_bg_color(points[r], lv_color_hex(en_cours ? ORANGE : 0x424242), 0);
          }

interval:
  - interval: 30s
    then:
      - script.execute: planning_rafraichir
