            pad_all: 0
            bg_color: 0x303030
            scrollable: false
            clickable: false
            hidden: true
        - label:
            id: lbl_pla_nom_3
            align: TOP_LEFT
            x: ${planning_x}
            y: 134
            hidden: true
            text: ""
        - obj:
            id: obj_pla_bande_3
            align: TOP_LEFT
            x: ${planning_x}
            y: 154
            width: 192
            height: 14
            radius: 0
            border_width: 0
            pad_all: 0
            bg_color: 0x303030
            scrollable: false
            clickable: false
            hidden: true
        - label:
            id: lbl_pla_nom_4
            align: TOP_LEFT
            x: ${planning_x}
            y: 184
            hidden: true
            text: ""
        - obj:
            id: obj_pla_bande_4
            align: TOP_LEFT
