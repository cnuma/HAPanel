            y: 144
            text_color: 0x9E9E9E
            hidden: true
            text: "0"
        - label:
            id: lbl_pla_h6
            align: TOP_LEFT
            x: 51
            y: 144
            width: 30
            text_align: CENTER
            text_color: 0x9E9E9E
