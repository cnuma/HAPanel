# Ecran planning (D020) : creneaux du jour de 1 a 4 calendriers de chauffage,
# une bande de 24 h par calendrier, au quart d'heure. Valeurs recues par
# packages/liaison_ha.yaml, poussees par le blueprint
# blueprints/automation/hapanel/ecran_planning.yaml. Aucune commande.
substitutions:
  # Bande : 2 pixels par quart d'heure.
  planning_x: "24"

esphome:
  # Sans HA au demarrage, aucun changement de connexion n'appelle le
  # rafraichissement.
  on_boot:
    priority: -100
    then:
      - script.execute: planning_rafraichir

