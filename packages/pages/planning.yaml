        - label:
            id: lbl_pla_h12
            align: TOP_LEFT
            x: 105
            y: 144
            width: 30
            text_align: CENTER
            text_color: 0x9E9E9E
            hidden: true
            text: "12"
        - label:
            id: lbl_pla_h18
            align: TOP_LEFT
            x: 159
            y: 144
            width: 30
