            width: ${fmt_sce_bouton_l}
            height: ${fmt_sce_bouton_h}
            pad_all: 4
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: ico_sce_6
                  text_font: police_scenarios
                  hidden: true
                  text: ""
              - label:
                  id: lbl_sce_6
                  width: ${fmt_sce_nom_l}
                  text_align: CENTER
                  text: ""
            on_click:
              - script.execute:
                  id: scenarios_lancer
                  indice: 5

script:
  # Sans connexion, valeur a jour ou reponse attendue, aucune commande (P2, P4).
  - id: scenarios_lancer
    parameters:
      indice: int
    then:
      - if:
          condition:
            lambda: |-
              const std::string &nom = id(liaison_scenarios_nom)[indice];
              return id(ha_connecte_affiche) == 1 && id(liaison_scenarios_etat) == 1
                     && id(scenarios_retour) != 1 && !nom.empty() && nom != "-" && nom != "?";
          then:
            - lambda: |-
                id(scenarios_indice) = indice;
                id(scenarios_retour) = 1;
                id(scenarios_retour_ms) = millis();
            - script.execute: scenarios_rafraichir
            - homeassistant.event:
                event: esphome.hapanel_commande
                data:
                  commande: scenario
                  valeur: !lambda return std::to_string(indice + 1);
            - logger.log:
                tag: hapanel.scenarios
                level: INFO
                format: "scenario envoye %d"
                args: ["indice + 1"]
  # Redessine l'ecran scenarios. Appele a chaque valeur recue, a chaque changement
  # de connexion, a la peremption et a chaque etape d'un lancement.
  - id: scenarios_rafraichir
    then:
      - lambda: |-
          // Valeurs du blueprint. Valeur inconnue : pas d'icone, bleu.
          static const char *const icones[][2] = {
              {"lumiere", "\U000F06E8"}, {"lumiere_eteinte", "\U000F0E4F"}, {"soleil", "\U000F0599"},
              {"lune", "\U000F0594"}, {"maison", "\U000F02DC"}, {"depart", "\U000F0A48"},
              {"retour", "\U000F0F9C"}, {"canape", "\U000F04B9"}, {"film", "\U000F0FCE"},
              {"musique", "\U000F075A"}, {"television", "\U000F0502"}, {"lit", "\U000F02E3"},
              {"reveil", "\U000F0020"}, {"repas", "\U000F0A70"}, {"cafe", "\U000F0176"},
              {"chauffage", "\U000F0438"}, {"hors_gel", "\U000F0717"}, {"ventilateur", "\U000F0210"},
              {"volets", "\U000F111C"}, {"prise", "\U000F1108"}, {"alarme", "\U000F068A"},
              {"verrou", "\U000F033E"}, {"arrosage", "\U000F1481"}, {"vacances", "\U000F0092"},
              {"scenario", "\U000F0D19"}};
          // Toutes lisibles avec un texte blanc.
          static const struct { const char *nom; uint32_t rgb; } teintes[] = {
              {"bleu", 0x1976D2}, {"vert", 0x2E7D32}, {"orange", 0xE65100}, {"rouge", 0xC62828},
              {"violet", 0x6A1B9A}, {"turquoise", 0x00838F}, {"rose", 0xAD1457}, {"gris", 0x546E7A}};
          lv_obj_t *boutons[] = {id(btn_sce_1), id(btn_sce_2), id(btn_sce_3),
                                 id(btn_sce_4), id(btn_sce_5), id(btn_sce_6)};
          lv_obj_t *labels[] = {id(lbl_sce_1), id(lbl_sce_2), id(lbl_sce_3),
                                id(lbl_sce_4), id(lbl_sce_5), id(lbl_sce_6)};
          lv_obj_t *icos[] = {id(ico_sce_1), id(ico_sce_2), id(ico_sce_3),
                              id(ico_sce_4), id(ico_sce_5), id(ico_sce_6)};
          bool connecte = id(ha_connecte_affiche) == 1;
          int e = id(liaison_scenarios_etat);
          int retour = id(scenarios_retour);
          bool aucun = true;
          for (int i = 0; i < 6; i++) {
            const std::string &nom = id(liaison_scenarios_nom)[i];
            bool visible = e == 1 && !nom.empty() && nom != "-";
            bool dispo = nom != "?";
            if (visible) {
              aucun = false;
              lv_obj_remove_flag(boutons[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(boutons[i], LV_OBJ_FLAG_HIDDEN);
            }
            lv_label_set_text(labels[i], dispo ? nom.c_str() : "Indisponible");

            const char *glyphe = nullptr;
            for (auto &c : icones) if (id(liaison_scenarios_icone)[i] == c[0]) glyphe = c[1];
            if (glyphe != nullptr) {
              lv_label_set_text(icos[i], glyphe);
              lv_obj_remove_flag(icos[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(icos[i], LV_OBJ_FLAG_HIDDEN);
            }
            // Avec une icone, 2 lignes de nom au plus : le bouton fait 68 px.
            lv_obj_set_style_max_height(labels[i], glyphe != nullptr ? 38 : LV_COORD_MAX, 0);

            uint32_t rgb = teintes[0].rgb;
            for (auto &t : teintes) if (id(liaison_scenarios_couleur)[i] == t.nom) rgb = t.rgb;
            lv_obj_set_style_bg_color(boutons[i], lv_color_hex(rgb), LV_STATE_DEFAULT);
            // Inactif : gris quelle que soit la couleur choisie.
            lv_obj_set_style_bg_color(boutons[i], lv_color_hex(0x3A3A3A), LV_STATE_DISABLED);

            if (connecte && dispo && retour != 1) lv_obj_remove_state(boutons[i], LV_STATE_DISABLED);
            else lv_obj_add_state(boutons[i], LV_STATE_DISABLED);
          }
          // Connexion toujours visible (P2), puis etat des valeurs (P3), puis
          // resultat du lancement.
          char texte[48];
          const std::string &nom = id(liaison_scenarios_nom)[id(scenarios_indice)];
          if (!connecte) snprintf(texte, sizeof(texte), "HA non connecté");
          else if (e == 3) snprintf(texte, sizeof(texte), "périmés");
          else if (e == 0) snprintf(texte, sizeof(texte), "non reçus");
          else if (retour == 1) snprintf(texte, sizeof(texte), "Envoi en cours");
          else if (retour == 2) snprintf(texte, sizeof(texte), "Lancé : %s", nom.c_str());
          else if (retour == 3) snprintf(texte, sizeof(texte), "Pas de réponse de HA");
          else if (retour == 4) snprintf(texte, sizeof(texte), "Refusé par HA");
          else if (aucun) snprintf(texte, sizeof(texte), "Aucun scénario choisi");
          else texte[0] = '\0';
          lv_label_set_text(id(lbl_sce_etat), texte);
          lv_obj_set_style_text_color(id(lbl_sce_etat), lv_color_hex(connecte && retour == 2 ? 0x4CAF50 : 0xFF9800), 0);

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              int r = id(scenarios_retour);
              if (r == 0) return false;
              return millis() - id(scenarios_retour_ms) > (r == 1 ? ${scenarios_attente_ms} : ${scenarios_message_ms});
          then:
            - lambda: |-
                id(scenarios_retour) = id(scenarios_retour) == 1 ? 3 : 0;
                id(scenarios_retour_ms) = millis();
            - script.execute: scenarios_rafraichir
