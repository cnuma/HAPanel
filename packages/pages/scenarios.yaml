# Ecran scenarios (D024, D026) : 6 boutons au plus, qui lancent les scenes, scripts
# et automatisations choisis dans le blueprint
# blueprints/automation/hapanel/module.yaml, avec nom, icone et couleur. Valeurs
# recues par packages/liaison_ha.yaml. Le panneau n'envoie qu'un numero : seul le
# blueprint connait les entites (P1).
substitutions:
  # Sans reponse de Home Assistant dans ce delai, le panneau le signale (P2).
  scenarios_attente_ms: "10000"
  # Duree d'affichage du resultat.
  scenarios_message_ms: "5000"

font:
  # Icones Material Design du blueprint, meme ordre que scenarios_rafraichir (G6) :
  # lumiere, lumiere_eteinte, soleil, lune, maison, depart, retour, canape, film,
  # musique, television, lit, reveil, repas, cafe, chauffage, hors_gel, ventilateur,
  # volets, prise, alarme, verrou, arrosage, vacances, scenario.
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: police_scenarios
    size: 24
    bpp: 4
    glyphs: ["\U000F06E8", "\U000F0E4F", "\U000F0599", "\U000F0594", "\U000F02DC", "\U000F0A48", "\U000F0F9C", "\U000F04B9", "\U000F0FCE", "\U000F075A", "\U000F0502", "\U000F02E3", "\U000F0020", "\U000F0A70", "\U000F0176", "\U000F0438", "\U000F0717", "\U000F0210", "\U000F111C", "\U000F1108", "\U000F068A", "\U000F033E", "\U000F1481", "\U000F0092", "\U000F0D19"]

esphome:
  # Sans HA au demarrage, aucun changement de connexion n'appelle le
  # rafraichissement.
  on_boot:
    priority: -100
    then:
      - script.execute: scenarios_rafraichir

globals:
  # Lancement : 0 aucun, 1 attente de HA, 2 lance, 3 pas de reponse, 4 refuse.
  - id: scenarios_retour
    type: int
    initial_value: "0"
  - id: scenarios_retour_ms
    type: uint32_t
    initial_value: "0"
  - id: scenarios_indice
    type: int
    initial_value: "0"

lvgl:
  pages:
    - id: page_scenarios
      bg_color: 0x000000
      # Titre dans la barre d'etat (D036) ; contenu sous la barre (y >= 38).
      on_load:
        - lvgl.label.update:
            id: lbl_barre_titre
            text: "Scénarios"
      widgets:
        - label:
            id: lbl_sce_etat
            align: TOP_LEFT
            x: 12
            y: 38
            width: ${fmt_texte_largeur}
            long_mode: DOT
            text_color: 0xFF9800
            text: ""
        # Icone masquee sans choix : la colonne centre alors le nom seul.
        - button:
            id: btn_sce_1
            align: TOP_LEFT
            x: ${fmt_sce_1_x}
            y: ${fmt_sce_1_y}
            width: ${fmt_sce_bouton_l}
            height: ${fmt_sce_bouton_h}
            pad_all: 4
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: ico_sce_1
                  text_font: police_scenarios
                  hidden: true
                  text: ""
              - label:
                  id: lbl_sce_1
                  width: ${fmt_sce_nom_l}
                  text_align: CENTER
                  text: ""
            on_click:
              - script.execute:
                  id: scenarios_lancer
                  indice: 0
        - button:
            id: btn_sce_2
            align: TOP_LEFT
            x: ${fmt_sce_2_x}
            y: ${fmt_sce_2_y}
            width: ${fmt_sce_bouton_l}
            height: ${fmt_sce_bouton_h}
            pad_all: 4
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: ico_sce_2
                  text_font: police_scenarios
                  hidden: true
                  text: ""
              - label:
                  id: lbl_sce_2
                  width: ${fmt_sce_nom_l}
                  text_align: CENTER
                  text: ""
            on_click:
              - script.execute:
                  id: scenarios_lancer
                  indice: 1
        - button:
            id: btn_sce_3
            align: TOP_LEFT
            x: ${fmt_sce_3_x}
            y: ${fmt_sce_3_y}
            width: ${fmt_sce_bouton_l}
            height: ${fmt_sce_bouton_h}
            pad_all: 4
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: ico_sce_3
                  text_font: police_scenarios
                  hidden: true
                  text: ""
              - label:
                  id: lbl_sce_3
                  width: ${fmt_sce_nom_l}
                  text_align: CENTER
                  text: ""
            on_click:
              - script.execute:
                  id: scenarios_lancer
                  indice: 2
        - button:
            id: btn_sce_4
            align: TOP_LEFT
            x: ${fmt_sce_4_x}
            y: ${fmt_sce_4_y}
            width: ${fmt_sce_bouton_l}
            height: ${fmt_sce_bouton_h}
            pad_all: 4
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: ico_sce_4
                  text_font: police_scenarios
                  hidden: true
                  text: ""
              - label:
                  id: lbl_sce_4
                  width: ${fmt_sce_nom_l}
                  text_align: CENTER
                  text: ""
            on_click:
              - script.execute:
                  id: scenarios_lancer
                  indice: 3
        - button:
            id: btn_sce_5
            align: TOP_LEFT
            x: ${fmt_sce_5_x}
            y: ${fmt_sce_5_y}
            width: ${fmt_sce_bouton_l}
            height: ${fmt_sce_bouton_h}
            pad_all: 4
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: ico_sce_5
                  text_font: police_scenarios
                  hidden: true
                  text: ""
              - label:
                  id: lbl_sce_5
                  width: ${fmt_sce_nom_l}
                  text_align: CENTER
