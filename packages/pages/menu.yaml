# Ecran menu (D025) : acces a toutes les pages depuis la barre de navigation.
# Une place reste libre pour la prochaine page. Fonctionne sans Home Assistant (P5).
lvgl:
  pages:
    - id: page_menu
      bg_color: 0x000000
      widgets:
        - button:
            id: btn_men_accueil
            align: TOP_LEFT
            x: 8
            y: 8
            width: 108
            height: 80
            pad_all: 4
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text_font: police_icones
                  text: "\U000F02DC"
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "Accueil"
            on_click:
              - lvgl.page.show:
                  id: page_accueil
                  animation: NONE
