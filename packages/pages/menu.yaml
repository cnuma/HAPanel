# Ecran menu (D025) : acces a toutes les pages par le bouton Menu de la barre d'etat (D036).
# Fonctionne sans Home Assistant (P5).
lvgl:
  pages:
    - id: page_menu
      bg_color: 0x000000
      # Sur le menu, le bouton Menu ne ferait rien : seul Accueil reste (D025).
      # Pas de tuile Accueil, doublon du bouton de la barre.
      on_load:
        - lvgl.widget.hide: btn_nav_menu
        - lvgl.label.update:
            id: lbl_barre_titre
            text: "Menu"
      on_unload:
        - lvgl.widget.show: btn_nav_menu
      widgets:
        - button:
            id: btn_men_meteo
            align: TOP_LEFT
            x: 8
            y: 40
            width: 108
            height: 72
            pad_all: 4
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text_font: police_icones
                  text: "\U000F0595"
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "Météo"
            on_click:
              - lvgl.page.show:
                  id: page_meteo
                  animation: NONE
        - button:
            id: btn_men_planning
            align: TOP_LEFT
            x: 124
            y: 40
            width: 108
            height: 72
            pad_all: 4
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text_font: police_icones
                  text: "\U000F00F0"
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "Planning"
            on_click:
              - lvgl.page.show:
                  id: page_planning
                  animation: NONE
        - button:
            id: btn_men_scenarios
            align: TOP_LEFT
            x: 8
            y: 118
            width: 108
            height: 72
            pad_all: 4
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text_font: police_icones
                  text: "\U000F0D19"
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "Scénarios"
            on_click:
              - lvgl.page.show:
                  id: page_scenarios
                  animation: NONE
        - button:
            id: btn_men_apropos
            align: TOP_LEFT
            x: 8
            y: 196
            width: 108
            height: 72
            pad_all: 4
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text_font: police_icones
                  text: "\U000F02FD"
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "À propos"
            on_click:
              - lvgl.page.show:
                  id: page_apropos
                  animation: NONE
        - button:
            id: btn_men_reglages
            align: TOP_LEFT
            x: 124
            y: 118
            width: 108
            height: 72
            pad_all: 4
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text_font: police_icones
                  text: "\U000F0493"
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "Réglages"
            on_click:
              - lvgl.page.show:
                  id: page_reglages
                  animation: NONE
        # Mise a jour (D047) : violet de l'icone de la barre d'etat (D045),
        # affiche seulement quand une mise a jour attend (acces_public.yaml) ;
        # jamais dans le binaire prive. Ouvre la confirmation.
        - button:
            id: btn_men_maj
            align: TOP_LEFT
            x: 124
            y: 196
            width: 108
            height: 72
            pad_all: 4
            hidden: true
            bg_color: 0xAB47BC
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text_font: police_icones
                  text: "\U000F005F"
              - label:
                  align: BOTTOM_MID
                  y: -8
                  text: "Mise à jour"
            on_click:
              - script.execute: maj_proposer
