# Socle : noeud, plateforme, Wi-Fi, API chiffree, OTA protegee, journaux et
# identite de build. Secrets dans secrets.yaml (invariant G9).
esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  # Un seul binaire pour tous les modules : nom unique tire de l'adresse MAC
  # (hapanel-xxxxxx), D012.
  name_add_mac_suffix: true
  project:
    name: cnuma.hapanel
    version: ${version}
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: identite_build
          state: "${version} (${git_sha})"
      - logger.log:
          tag: hapanel.build
          level: INFO
          format: "HAPanel ${version} (${git_sha})"

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      # Puce du panneau en revision 3.1 : binaire plus petit (D011).
      minimum_chip_revision: "3.1"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Chiffree par la cle de l'API, heritee faute de cle propre (D010).
    encryption:

logger:
  level: ${log_level}

sensor:
  - platform: wifi_signal
    id: signal_wifi
    name: "Signal Wi-Fi"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: template
    id: identite_build
    name: "Version"
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: never
