# Socle : noeud, plateforme, journaux, ecriture des reglages et identite de build.
# Aucun secret ici (G9) : voir acces_prive.yaml et acces_public.yaml.
esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  # Un seul binaire pour tous les modules : nom unique tire de l'adresse MAC
  # (hapanel-xxxxxx), D012.
  name_add_mac_suffix: true
  project:
    name: cnuma.hapanel
    version: ${version}
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: identite_build
          state: "${version} (${git_sha})"
      - logger.log:
          tag: hapanel.build
          level: INFO
          format: "HAPanel ${version} (${git_sha})"

# Puce (ESP32, ESP32-S3) : fichier materiel de chaque carte (D049).

# Wi-Fi, cle de l'API et OTA : acces_prive.yaml (secrets compiles) ou
# acces_public.yaml (saisis a l'installation), D039.

logger:
  level: ${log_level}

# Reglages gardes en flash (D027, D031) : ESPHome ne les ecrit qu'a cet
# intervalle (60 s par defaut) ; une coupure avant les perdait (C2, D034).
# Seules les valeurs changees sont ecrites (G3).
preferences:
  flash_write_interval: 5s

sensor:
  - platform: wifi_signal
    id: signal_wifi
    name: "Signal Wi-Fi"
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: template
    id: identite_build
    name: "Version"
    icon: mdi:tag-outline
    entity_category: diagnostic
    update_interval: never
