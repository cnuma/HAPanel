# Materiel : ESP32-2432S024C (D004). Seul fichier qui declare broches et bus
# (invariant G2).
#
# Brochage publie pour cette carte, sans documentation vendeur. Confirme au
# banc le 28 octobre 2026 : ecran ILI9341, bus SPI, bus I2C et reset du
# tactile. pin_tactile_int ne recoit aucune interruption (D009, R6).
substitutions:
  display_model: ILI9341
  pin_spi_clk: GPIO14
  pin_spi_mosi: GPIO13
  pin_spi_miso: GPIO12
  pin_ecran_cs: GPIO15
  pin_ecran_dc: GPIO2
  pin_retroeclairage: GPIO27
  pin_i2c_sda: GPIO33
  pin_i2c_scl: GPIO32
  pin_tactile_int: GPIO21  # non utilisee (D009)
  pin_tactile_rst: GPIO25
  # LED RVB allumee a l'etat bas, confirmee au banc le 31 octobre 2026 (D017).
  pin_led_rouge: GPIO4
  pin_led_vert: GPIO16
  pin_led_bleu: GPIO17
  # LDR, confirmee au banc le 31 octobre 2026 : la tension monte dans le noir.
  pin_ldr: GPIO34

spi:
  id: bus_spi_ecran
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  # GPIO12 est une broche de demarrage : cablage d'origine de la carte.
  miso_pin:
    number: ${pin_spi_miso}
    ignore_strapping_warning: true

i2c:
  id: bus_i2c_tactile
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  # 400 kHz (50 kHz par defaut) : lecture du tactile plus courte, toutes les 20 ms.
  frequency: 400kHz

output:
  - platform: ledc
    id: sortie_retroeclairage
    pin: ${pin_retroeclairage}
  - platform: ledc
    id: sortie_led_rouge
    pin:
      number: ${pin_led_rouge}
      inverted: true
  - platform: ledc
    id: sortie_led_vert
    pin:
      number: ${pin_led_vert}
      inverted: true
  - platform: ledc
    id: sortie_led_bleu
    pin:
      number: ${pin_led_bleu}
      inverted: true

sensor:
  # Interne (pas d'entite HA) ; signal instable, moyenne sur 5 s, publiee
  # toutes les 2 s : l'ecran baisse vite quand on eteint la lumiere (D023,
  # retour du proprietaire, 3 novembre 2026 ; 1 min auparavant).
  - platform: adc
    id: ldr_tension
    pin: ${pin_ldr}
    attenuation: 0db
    samples: 8
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 2
          send_first_at: 1
    on_value:
      - logger.log:
          tag: hapanel.led
          level: DEBUG
          format: "LDR %.3f V"
          args: [x]

light:
  - platform: monochromatic
    id: retroeclairage
    name: "Rétroéclairage"
    output: sortie_retroeclairage
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: mipi_spi
    id: ecran
    model: ${display_model}
    spi_id: bus_spi_ecran
    # 20 MHz au lieu de 40 : essai contre une ligne parasite fugace en haut de
    # l'ecran (retour du proprietaire du 4 novembre 2026, cahier I11).
    data_rate: 20MHz
    cs_pin:
      number: ${pin_ecran_cs}
      ignore_strapping_warning: true
    dc_pin:
      number: ${pin_ecran_dc}
      ignore_strapping_warning: true

touchscreen:
  - platform: cst816
    id: tactile
    i2c_id: bus_i2c_tactile
    display: ecran
    # Lecture periodique : aucune interruption n'arrive sur pin_tactile_int,
    # volontairement non declaree (D009). 20 ms au lieu de 50 ms : un toucher
    # bref n'est plus manque (retour du proprietaire, 3 novembre 2026).
    update_interval: 20ms
    reset_pin: ${pin_tactile_rst}
