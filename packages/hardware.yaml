# Materiel : ESP32-2432S024C (D004). Seul fichier qui declare broches et bus
# (invariant G2).
#
# Brochage publie pour cette carte, sans documentation vendeur. Confirme au
# banc le 28 octobre 2026 : ecran ILI9341, bus SPI, bus I2C et reset du
# tactile. pin_tactile_int ne recoit aucune interruption (D009, R6).
substitutions:
  display_model: ILI9341
  pin_spi_clk: GPIO14
  pin_spi_mosi: GPIO13
  pin_spi_miso: GPIO12
  pin_ecran_cs: GPIO15
  pin_ecran_dc: GPIO2
  pin_retroeclairage: GPIO27
  pin_i2c_sda: GPIO33
  pin_i2c_scl: GPIO32
  pin_tactile_int: GPIO21  # non utilisee (D009)
  pin_tactile_rst: GPIO25
  # LED RVB allumee a l'etat bas, confirmee au banc le 31 octobre 2026 (D017).
  pin_led_rouge: GPIO4
  pin_led_vert: GPIO16
  pin_led_bleu: GPIO17

spi:
  id: bus_spi_ecran
  clk_pin: ${pin_spi_clk}
  mosi_pin: ${pin_spi_mosi}
  # GPIO12 est une broche de demarrage : cablage d'origine de la carte.
  miso_pin:
    number: ${pin_spi_miso}
    ignore_strapping_warning: true

i2c:
  id: bus_i2c_tactile
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}

output:
  - platform: ledc
    id: sortie_retroeclairage
    pin: ${pin_retroeclairage}
  - platform: ledc
    id: sortie_led_rouge
    pin:
      number: ${pin_led_rouge}
      inverted: true
  - platform: ledc
    id: sortie_led_vert
    pin:
      number: ${pin_led_vert}
      inverted: true
  - platform: ledc
    id: sortie_led_bleu
    pin:
      number: ${pin_led_bleu}
      inverted: true

light:
  - platform: monochromatic
    id: retroeclairage
    name: "Rétroéclairage"
    output: sortie_retroeclairage
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: mipi_spi
    id: ecran
    model: ${display_model}
    spi_id: bus_spi_ecran
    data_rate: 40MHz
    cs_pin:
      number: ${pin_ecran_cs}
      ignore_strapping_warning: true
    dc_pin:
      number: ${pin_ecran_dc}
      ignore_strapping_warning: true

touchscreen:
  - platform: cst816
    id: tactile
    i2c_id: bus_i2c_tactile
    display: ecran
    # Lecture periodique (50 ms) : aucune interruption n'arrive sur
    # pin_tactile_int, volontairement non declaree (D009).
    update_interval: 50ms
    reset_pin: ${pin_tactile_rst}
