# Socle graphique LVGL, barre de navigation et page « À propos » (version,
# SHA, connexion a Home Assistant, memoire). Carte sans PSRAM : buffer_size explicite (G6, R2).
font:
  - file: "gfonts://Roboto"
    id: police_texte
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@500"
    id: police_titre
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  # Icones Material Design (celles de Home Assistant), glyphes limites (G6) :
  # maison, Manuel (circle-medium), Hors-gel (snowflake), Eco (leaf),
  # Confort (sofa), Boost (rocket-launch), wifi-off, lan-disconnect (D015),
  # meteo (weather-partly-cloudy, D019), planning (calendar-clock, D020),
  # scenarios (play-box-multiple, D024), menu et a propos (information-outline, D025),
  # fermeture du message d'accueil (close, D028), reglages (cog, D031),
  # reglage impose (lock, D031), enregistrement (content-save, D035).
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: police_icones
    size: 24
    bpp: 4
    glyphs: ["\U000F02DC", "\U000F09DE", "\U000F0717", "\U000F032A", "\U000F04B9", "\U000F14DE", "\U000F05AA", "\U000F0319", "\U000F0595", "\U000F00F0", "\U000F0D19", "\U000F035C", "\U000F02FD", "\U000F0156", "\U000F0493", "\U000F033E", "\U000F0193"]

globals:
  # Etat de connexion affiche : 0 non connecte, 1 connecte. Le libelle n'est
  # redessine qu'au changement d'etat.
  - id: ha_connecte_affiche
    type: int
    initial_value: "0"

lvgl:
  displays: [ecran]
  touchscreens: [tactile]
  buffer_size: 25%
  # Reveil par packages/led_veille.yaml, au relachement du doigt (D017).
  resume_on_input: false
  bg_color: 0x000000
  text_color: 0xFFFFFF
  text_font: police_texte
  pages:
    - id: page_apropos
      bg_color: 0x000000
      on_load:
        - lvgl.label.update:
            id: lbl_barre_titre
            text: "À propos"
      widgets:
        - label:
            id: lbl_apropos_version
            align: TOP_LEFT
            x: 12
            y: 60
            text: "HAPanel ${version}"
        - label:
            id: lbl_apropos_sha
            align: TOP_LEFT
            x: 12
            y: 88
            text: "SHA ${git_sha}"
        - label:
            id: lbl_apropos_connexion
            align: TOP_LEFT
            x: 12
            y: 128
            text_color: 0xF44336
            text: "Home Assistant : non connecté"
        - label:
            id: lbl_apropos_memoire
            align: TOP_LEFT
            x: 12
            y: 168
            long_mode: WRAP
            width: 216
            text: "Mémoire : mesure en cours"
  # Navigation (D025 revisee par D036) : bouton Menu dans la barre d'etat en
  # haut, bouton Accueil centre en bas ; pas de barre du bas sur l'accueil.
  top_layer:
    widgets:
      - obj:
          id: obj_nav
          align: BOTTOM_MID
          # Page de demarrage : l'accueil (packages/pages/accueil.yaml).
          hidden: true
          width: 240
          height: 44
          radius: 0
          border_width: 0
          pad_all: 4
          bg_color: 0x212121
          scrollable: false
          widgets:
            - button:
                id: btn_nav_accueil
                align: CENTER
                width: 68
                height: 36
                widgets:
                  - label:
                      align: CENTER
                      text_font: police_icones
                      text: "\U000F02DC"
                on_click:
                  - lvgl.page.show:
                      id: page_accueil
                      animation: NONE
      # Barre d'etat, commune a toutes les pages (D036) : titre de la page (date
      # et heure sur l'accueil), enregistrement, Wi-Fi, connexion a HA (P2) et
      # bouton Menu. Les pages commencent sous la barre (y >= 38).
      - obj:
          id: obj_barre
          align: TOP_MID
          width: 240
          height: 36
          radius: 0
          border_width: 0
          pad_all: 0
          bg_color: 0x212121
          scrollable: false
          widgets:
            # Accueil seulement (on_load de page_accueil), mise a jour par
            # accueil_heure.
            - label:
                id: lbl_barre_date
                align: TOP_LEFT
                x: 8
                y: 9
                text: "--:--"
            # Autres pages : titre ecrit par leur on_load.
            - label:
                id: lbl_barre_titre
                align: TOP_LEFT
                x: 8
                y: 9
                hidden: true
                text: ""
            # Reglage en cours d'enregistrement (D035). Script
            # enregistrement_signaler.
            - label:
                id: ico_barre_enregistrement
                align: TOP_LEFT
                x: 124
                y: 6
                hidden: true
                text_font: police_icones
                text_color: 0x9E9E9E
                text: "\U000F0193"
            # Wi-Fi : 4 barres, script accueil_wifi.
            - obj:
                id: obj_barre_wifi_1
                align: TOP_LEFT
                x: 152
                y: 21
                width: 4
                height: 4
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            - obj:
                id: obj_barre_wifi_2
                align: TOP_LEFT
                x: 158
                y: 18
                width: 4
                height: 7
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            - obj:
                id: obj_barre_wifi_3
                align: TOP_LEFT
                x: 164
                y: 15
                width: 4
                height: 10
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            - obj:
                id: obj_barre_wifi_4
                align: TOP_LEFT
                x: 170
                y: 12
                width: 4
                height: 13
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            # Connexion a HA : vert ou rouge, script accueil_rafraichir.
            - obj:
                id: obj_barre_point_ha
                align: TOP_LEFT
                x: 180
                y: 12
                width: 13
                height: 13
                radius: 7
                border_width: 0
                pad_all: 0
                bg_color: 0xF44336
            # Masque sur la page Menu, ou il ne ferait rien (D025).
            - button:
                id: btn_nav_menu
                align: RIGHT_MID
                x: -2
                width: 42
                height: 32
                widgets:
                  - label:
                      align: CENTER
                      text_font: police_icones
                      text: "\U000F035C"
                on_click:
                  - lvgl.page.show:
                      id: page_menu
                      animation: NONE

script:
  # Appele a chaque changement d'un reglage garde en flash (D027, D028, D031) :
  # disquette grise tant que le reglage n'est pas ecrit, ecriture 5 s apres le
  # dernier changement (un curseur deplace ne donne qu'une ecriture, G3), puis
  # disquette verte 2 s (D035).
  - id: enregistrement_signaler
    mode: restart
    then:
      # Au demarrage, les entites publient la valeur relue en flash, parfois
      # avant que LVGL ait cree l'icone : rien a enregistrer.
      - if:
          condition:
            lambda: return App.is_setup_complete() && id(ico_barre_enregistrement) != nullptr;
          then:
            - lvgl.label.update:
                id: ico_barre_enregistrement
                text_color: 0x9E9E9E
            - lvgl.widget.show: ico_barre_enregistrement
            - delay: 5s
            - lambda: global_preferences->sync();
            - lvgl.label.update:
                id: ico_barre_enregistrement
                text_color: 0x4CAF50
            - delay: 2s
            - lvgl.widget.hide: ico_barre_enregistrement

interval:
  # Connexion a Home Assistant : seul un client qui s'annonce « Home
  # Assistant » compte comme connecte (P2, D013). esphome logs s'abonne aussi
  # aux etats : state_subscription_only ne suffit pas.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              if (api::global_api_server == nullptr) return false;
              for (auto &client : api::global_api_server->active_clients()) {
                const char *nom = client->get_name();
                if (nom != nullptr && strncmp(nom, "Home Assistant", 14) == 0) return true;
              }
              return false;
          then:
            - if:
                condition:
                  lambda: return id(ha_connecte_affiche) != 1;
                then:
                  - globals.set:
                      id: ha_connecte_affiche
                      value: "1"
                  - lvgl.label.update:
                      id: lbl_apropos_connexion
                      text_color: 0x4CAF50
                      text: "Home Assistant : connecté"
                  - script.execute: liaison_connectee
          else:
            - if:
                condition:
                  lambda: return id(ha_connecte_affiche) != 0;
                then:
                  - globals.set:
                      id: ha_connecte_affiche
                      value: "0"
                  - lvgl.label.update:
                      id: lbl_apropos_connexion
                      text_color: 0xF44336
                      text: "Home Assistant : non connecté"
                  - script.execute: liaison_deconnectee
  - interval: 10s
    then:
      - lvgl.label.update:
          id: lbl_apropos_memoire
          text:
            format: "Mémoire : %u Ko libres, plus grand bloc %u Ko"
            args:
              - heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024
              - heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024
