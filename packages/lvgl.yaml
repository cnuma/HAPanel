# Socle graphique LVGL, barre d'etat en haut, bouton Accueil en bas et page « À propos » (version,
# SHA, connexion a Home Assistant, memoire). Carte sans PSRAM : buffer_size explicite (G6, R2).
font:
  - file: "gfonts://Roboto"
    id: police_texte
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@500"
    id: police_titre
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  # Icones Material Design (celles de Home Assistant), glyphes limites (G6) :
  # maison, Manuel (circle-medium), Hors-gel (snowflake), Eco (leaf),
  # Confort (sofa), Boost (rocket-launch), wifi-off, lan-disconnect (D015),
  # meteo (weather-partly-cloudy, D019), planning (calendar-clock, D020),
  # scenarios (play-box-multiple, D024), menu et a propos (information-outline, D025),
  # fermeture du message d'accueil (close, D028), reglages (cog, D031),
  # reglage impose (lock, D031), enregistrement (content-save, D035),
  # mise a jour disponible (arrow-up-bold-circle, D045).
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: police_icones
    size: 24
    bpp: 4
    glyphs: ["\U000F02DC", "\U000F09DE", "\U000F0717", "\U000F032A", "\U000F04B9", "\U000F14DE", "\U000F05AA", "\U000F0319", "\U000F0595", "\U000F00F0", "\U000F0D19", "\U000F035C", "\U000F02FD", "\U000F0156", "\U000F0493", "\U000F033E", "\U000F0193", "\U000F005F"]

# Adresse IP pour la page A propos, publiee par ESPHome a chaque changement
# (connexion, perte du Wi-Fi). Interne : aucune entite de plus dans HA (G10).
text_sensor:
  - platform: wifi_info
    ip_address:
      id: apropos_ip
      internal: true
      on_value:
        - lvgl.label.update:
            id: lbl_apropos_ip
            text: !lambda |-
              if (x.empty() || x == "0.0.0.0") return std::string("Adresse IP : aucune");
              return "Adresse IP : " + x;

globals:
  # Mise a jour du firmware en attente (D045) : ecrite par acces_public.yaml
  # (entite maj_firmware) ; toujours fausse dans le binaire prive, qui n'a pas
  # d'entite de mise a jour. Lue par la barre d'etat et par la LED.
  - id: maj_disponible
    type: bool
    initial_value: "false"
  # Bouton de la page A propos passe au violet par une recherche (D047) : le
  # toucher suivant ouvre la confirmation au lieu de chercher de nouveau
  # (demande du proprietaire, 9 novembre 2026). Remis a faux a l'ouverture de
  # la page ; jamais vrai dans le binaire prive.
  - id: apropos_maj_trouvee
    type: bool
    initial_value: "false"
  # Etat de connexion affiche : 0 non connecte, 1 connecte. Le libelle n'est
  # redessine qu'au changement d'etat.
  - id: ha_connecte_affiche
    type: int
    initial_value: "0"

lvgl:
  displays: [ecran]
  touchscreens: [tactile]
  buffer_size: 25%
  # Reveil par packages/led_veille.yaml, au relachement du doigt (D017).
  resume_on_input: false
  bg_color: 0x000000
  text_color: 0xFFFFFF
  text_font: police_texte
  pages:
    - id: page_apropos
      bg_color: 0x000000
      on_load:
        - lvgl.label.update:
            id: lbl_barre_titre
            text: "À propos"
        # Resultat d'une recherche precedente efface (D047), couleur d'origine.
        - lvgl.label.update:
            id: lbl_apropos_maj
            text: "Rechercher une mise à jour"
        - lambda: |-
            id(apropos_maj_trouvee) = false;
            lv_obj_remove_local_style_prop(id(btn_apropos_maj), LV_STYLE_BG_COLOR, LV_PART_MAIN);
      widgets:
        - label:
            id: lbl_apropos_version
            align: TOP_LEFT
            x: 12
            y: 60
            text: "HAPanel ${version}"
        - label:
            id: lbl_apropos_sha
            align: TOP_LEFT
            x: 12
            y: 88
            text: "SHA ${git_sha}"
        - label:
            id: lbl_apropos_connexion
            align: TOP_LEFT
            x: 12
            y: 128
            text_color: 0xF44336
            text: "Home Assistant : non connecté"
        # Adresse IP du module (demande du proprietaire, 7 novembre 2026) : trop
        # d'adresses en service pour s'en souvenir. Capteur apropos_ip.
        - label:
            id: lbl_apropos_ip
            align: TOP_LEFT
            x: 12
            y: 156
            text: "Adresse IP : aucune"
        - label:
            id: lbl_apropos_memoire
            align: TOP_LEFT
            x: 12
            y: 196
            long_mode: WRAP
            width: 216
            text: "Mémoire : mesure en cours"
        # Recherche d'une mise a jour (D047) : binaire public seulement, qui
        # l'affiche (acces_public.yaml) ; masque dans le binaire prive, sans
        # entite de mise a jour. Le libelle donne aussi le resultat.
        - button:
            id: btn_apropos_maj
            align: TOP_LEFT
            x: 12
            y: 238
            width: 216
            height: 34
            hidden: true
            widgets:
              - label:
                  id: lbl_apropos_maj
                  align: CENTER
                  text: "Rechercher une mise à jour"
            on_click:
              - script.execute: maj_rechercher
  # Navigation (D025 revisee par D036) : bouton Menu dans la barre d'etat en
  # haut, bouton Accueil centre en bas ; pas de barre du bas sur l'accueil.
  top_layer:
    widgets:
      - obj:
          id: obj_nav
          align: BOTTOM_MID
          # Derniere rangee de pixels laissee noire, comme la premiere (voir
          # obj_barre).
          y: -2
          # Page de demarrage : l'accueil (packages/pages/accueil.yaml).
          hidden: true
          width: 240
          height: 42
          radius: 0
          border_width: 0
          pad_all: 3
          bg_color: 0x212121
          scrollable: false
          widgets:
            - button:
                id: btn_nav_accueil
                align: CENTER
                width: 68
                height: 36
                widgets:
                  - label:
                      align: CENTER
                      text_font: police_icones
                      text: "\U000F02DC"
                on_click:
                  - lvgl.page.show:
                      id: page_accueil
                      animation: NONE
      # Barre d'etat, commune a toutes les pages (D036) : bouton Menu, titre de la
      # page (date et heure sur l'accueil), enregistrement, Wi-Fi et connexion a
      # HA (P2). Les pages commencent sous la barre (y >= 38).
      - obj:
          id: obj_barre
          align: TOP_MID
          # Premieres rangees de pixels laissees noires : allumee, la rangee 0 de
          # la dalle montre une ligne claire fugace (cahier I11 ; idee du
          # proprietaire, 4 novembre 2026).
          y: 2
          width: 240
          height: 34
          radius: 0
          border_width: 0
          pad_all: 0
          # La couche commune n'herite pas du texte blanc des pages : sans
          # cela, titre et date sont sombres sur le gris, donc invisibles.
          text_color: 0xFFFFFF
          text_font: police_texte
          bg_color: 0x212121
          scrollable: false
          # Laisse le toucher du bouton Menu deborder sous la barre.
          overflow_visible: true
          widgets:
            # Masque sur la page Menu, ou il ne ferait rien (D025). Sans fond :
            # seule l'icone, grisee pendant l'appui. Toute la hauteur de la barre,
            # et 6 px de plus autour pour le toucher : petit, il etait difficile
            # a attraper (retour du proprietaire, 4 novembre 2026). Sous lui,
            # aucune page n'a d'element touchable.
            - button:
                id: btn_nav_menu
                align: LEFT_MID
                width: 48
                height: 34
                ext_click_area: 6
                radius: 0
                bg_opa: TRANSP
                shadow_width: 0
                pressed:
                  bg_color: 0x424242
                  bg_opa: COVER
                widgets:
                  - label:
                      align: CENTER
                      text_font: police_icones
                      text: "\U000F035C"
                on_click:
                  - lvgl.page.show:
                      id: page_menu
                      animation: NONE
            # Accueil seulement (on_load de page_accueil), mise a jour par
            # accueil_heure.
            - label:
                id: lbl_barre_date
                align: TOP_LEFT
                x: 52
                y: 9
                text: "--:--"
            # Autres pages : titre ecrit par leur on_load.
            - label:
                id: lbl_barre_titre
                align: TOP_LEFT
                x: 52
                y: 9
                hidden: true
                text: ""
            # Reglage en cours d'enregistrement (D035). Script
            # enregistrement_signaler.
            - label:
                id: ico_barre_enregistrement
                align: TOP_LEFT
                x: 160
                y: 6
                hidden: true
                text_font: police_icones
                text_color: 0x9E9E9E
                text: "\U000F0193"
            # Mise a jour disponible (D045) : meme place que la disquette, qui
            # passe devant pendant un enregistrement. Clignotement par
            # l'intervalle de 500 ms en bas de ce fichier.
            - label:
                id: ico_barre_maj
                align: TOP_LEFT
                x: 160
                y: 6
                hidden: true
                text_font: police_icones
                text_color: 0xAB47BC
                text: "\U000F005F"
            # Wi-Fi : 4 barres, script accueil_wifi.
            - obj:
                id: obj_barre_wifi_1
                align: TOP_LEFT
                x: 192
                y: 21
                width: 4
                height: 4
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            - obj:
                id: obj_barre_wifi_2
                align: TOP_LEFT
                x: 198
                y: 18
                width: 4
                height: 7
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            - obj:
                id: obj_barre_wifi_3
                align: TOP_LEFT
                x: 204
                y: 15
                width: 4
                height: 10
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            - obj:
                id: obj_barre_wifi_4
                align: TOP_LEFT
                x: 210
                y: 12
                width: 4
                height: 13
                radius: 0
                border_width: 0
                pad_all: 0
                bg_color: 0x424242
            # Connexion a HA : vert ou rouge, script accueil_rafraichir.
            - obj:
                id: obj_barre_point_ha
                align: TOP_LEFT
                x: 220
                y: 12
                width: 13
                height: 13
                radius: 7
                border_width: 0
                pad_all: 0
                bg_color: 0xF44336

script:
  # Appele a chaque changement d'un reglage garde en flash (D027, D028, D031) :
  # disquette grise tant que le reglage n'est pas ecrit, ecriture 5 s apres le
  # dernier changement (un curseur deplace ne donne qu'une ecriture, G3), puis
  # disquette verte 2 s (D035).
  - id: enregistrement_signaler
    mode: restart
    then:
      # Au demarrage, les entites publient la valeur relue en flash, parfois
      # avant que LVGL ait cree l'icone : rien a enregistrer.
      - if:
          condition:
            lambda: return App.is_setup_complete() && id(ico_barre_enregistrement) != nullptr;
          then:
            - lvgl.label.update:
                id: ico_barre_enregistrement
                text_color: 0x9E9E9E
            - lvgl.widget.show: ico_barre_enregistrement
            - delay: 5s
            - lambda: global_preferences->sync();
            - lvgl.label.update:
                id: ico_barre_enregistrement
                text_color: 0x4CAF50
            - delay: 2s
            - lvgl.widget.hide: ico_barre_enregistrement

interval:
  # Connexion a Home Assistant : seul un client qui s'annonce « Home
  # Assistant » compte comme connecte (P2, D013). esphome logs s'abonne aussi
  # aux etats : state_subscription_only ne suffit pas.
  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              if (api::global_api_server == nullptr) return false;
              for (auto &client : api::global_api_server->active_clients()) {
                const char *nom = client->get_name();
                if (nom != nullptr && strncmp(nom, "Home Assistant", 14) == 0) return true;
              }
              return false;
          then:
            - if:
                condition:
                  lambda: return id(ha_connecte_affiche) != 1;
                then:
                  - globals.set:
                      id: ha_connecte_affiche
                      value: "1"
                  - lvgl.label.update:
                      id: lbl_apropos_connexion
                      text_color: 0x4CAF50
                      text: "Home Assistant : connecté"
                  - script.execute: liaison_connectee
          else:
            - if:
                condition:
                  lambda: return id(ha_connecte_affiche) != 0;
                then:
                  - globals.set:
                      id: ha_connecte_affiche
                      value: "0"
                  - lvgl.label.update:
                      id: lbl_apropos_connexion
                      text_color: 0xF44336
                      text: "Home Assistant : non connecté"
                  - script.execute: liaison_deconnectee
  # Icone de mise a jour (D045) : allumee 500 ms, eteinte 500 ms, tant qu'une
  # mise a jour attend et que la disquette n'est pas affichee. Le drapeau n'est
  # change qu'au besoin : sans mise a jour, rien n'est redessine.
  - interval: 500ms
    then:
      - lambda: |-
          static bool phase = false;
          phase = !phase;
          bool montrer = id(maj_disponible) && phase &&
                         lv_obj_has_flag(id(ico_barre_enregistrement), LV_OBJ_FLAG_HIDDEN);
          bool cachee = lv_obj_has_flag(id(ico_barre_maj), LV_OBJ_FLAG_HIDDEN);
          if (montrer && cachee) lv_obj_remove_flag(id(ico_barre_maj), LV_OBJ_FLAG_HIDDEN);
          else if (!montrer && !cachee) lv_obj_add_flag(id(ico_barre_maj), LV_OBJ_FLAG_HIDDEN);
  - interval: 10s
    then:
      - lvgl.label.update:
          id: lbl_apropos_memoire
          text:
            format: "Mémoire : %u Ko libres, plus grand bloc %u Ko"
            args:
              - heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024
              - heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL) / 1024
