# LED de face avant et ecran eteint par inactivite (D017). La couleur de la LED
# est calculee par accueil_rafraichir (packages/pages/accueil.yaml).
substitutions:
  # Sans toucher pendant ce delai, retour a l'accueil et ecran eteint.
  veille_delai_ms: "60000"
  # Respiration de la LED (D018) : niveaux a ajuster au banc. Plafond interpole
  # entre piece eclairee et piece sombre selon la tension de la LDR, qui monte
  # dans le noir, puis multiplie par le reglage « Intensite LED » (D027). Plancher
  # nul : la LED s'eteint au creux de chaque respiration.
  led_periode_ms: "6000"
  led_plancher: "0.0"
  led_plafond_jour: "0.25"
  led_plafond_nuit: "0.05"
  # 20 % des plafonds : 5 % de jour, 1 % de nuit (retour du proprietaire,
  # 2 novembre 2026).
  led_intensite_defaut: "20"
  # Arc-en-ciel du message d'accueil (D028) : un tour de couleurs.
  led_arc_periode_ms: "2000"
  ldr_tension_jour: "0.09"
  ldr_tension_nuit: "0.20"
  # Luminosite du retroeclairage (D023), a ajuster au banc. La correction gamma
  # de la lumiere reduit fortement les bas niveaux : 0.40 donne environ 8 % de PWM.
  retro_jour: "1.0"
  retro_nuit: "0.40"
  retro_ecart_min: "0.05"
  # Reglage « Intensite ecran » (D031) : multiplie les deux niveaux ci-dessus,
  # sans descendre sous le plancher, pour que l'ecran reste lisible (a ajuster
  # au banc).
  retro_plancher: "0.30"
  ecran_intensite_min: "20"
  ecran_intensite_defaut: "100"

globals:
  # Obscurite de la piece selon la LDR, de 0 (eclairee) a 1 (sombre).
  - id: ldr_obscurite
    type: float
    initial_value: "0.0f"
  # Luminosite appliquee au retroeclairage.
  - id: retro_niveau
    type: float
    initial_value: "${retro_jour}f"
  # Luminosite voulue, calculee par retro_cible_calculer.
  - id: retro_cible
    type: float
    initial_value: "${retro_jour}f"
  # Reglages imposes par le blueprint (D031) : cadenas sur la page Reglages.
  # Mis a jour par les cles led_* et ecran_intensite (packages/liaison_ha.yaml).
  - id: reglage_impose_led_mode
    type: bool
    initial_value: "false"
  - id: reglage_impose_led_intensite
    type: bool
    initial_value: "false"
  - id: reglage_impose_led_alerte
    type: bool
    initial_value: "false"
  - id: reglage_impose_ecran_intensite
    type: bool
    initial_value: "false"
  # Couleur du prereglage, calculee par accueil_rafraichir ; 0 : eteinte.
  - id: led_rouge
    type: float
    initial_value: "0.0f"
  - id: led_vert
    type: float
    initial_value: "0.0f"
  - id: led_bleu
    type: float
    initial_value: "0.0f"
  # LED en alerte : rouge clignotant (P2, P3).
  - id: led_alerte
    type: bool
    initial_value: "true"
  - id: led_allumee
    type: bool
    initial_value: "false"

# Reglages de la LED par module (D027) et intensite de l'ecran (D031), sur la
# page de l'appareil dans Home Assistant, sur la page Reglages du module
# (packages/pages/reglages.yaml) ou imposes par le blueprint (cles led_* et
# ecran_intensite, packages/liaison_ha.yaml). Gardes en flash, ecrits seulement
# quand ils changent (G3). Chaque changement met a jour la page Reglages.
select:
  - platform: template
    id: led_mode
    name: LED
    icon: mdi:led-on
    entity_category: config
    options:
      - Respiration
      - Éteinte
    initial_option: Respiration
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: reglages_rafraichir

number:
  - platform: template
    id: led_intensite
    name: Intensité LED
    icon: mdi:brightness-6
    entity_category: config
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    initial_value: ${led_intensite_defaut}
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: reglages_rafraichir
  - platform: template
    id: ecran_intensite
    name: Intensité écran
    icon: mdi:brightness-percent
    entity_category: config
    min_value: ${ecran_intensite_min}
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    initial_value: ${ecran_intensite_defaut}
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: retro_cible_calculer
      # Ecran eteint : applique au reveil (veille_reveiller).
      - if:
          condition:
            not: lvgl.is_paused
          then:
            - lambda: id(retro_niveau) = id(retro_cible);
            - light.turn_on:
                id: retroeclairage
                brightness: !lambda return id(retro_niveau);
                transition_length: 0.5s
      - script.execute: reglages_rafraichir

switch:
  - platform: template
    id: led_alerte_active
    name: Alerte LED
    icon: mdi:alert-circle-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # Desactivee : le clignotement en cours s'arrete aussitot.
    on_turn_off:
      - lambda: if (id(led_alerte)) id(sortie_led_rouge).set_level(0.0f);
      - script.execute: reglages_rafraichir
    on_turn_on:
      - script.execute: reglages_rafraichir

# En pause, LVGL ignore le toucher : reveiller au relachement du doigt empeche
# le premier toucher d'envoyer une commande (P4).
touchscreen:
  - id: !extend tactile
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - script.execute: veille_reveiller

script:
  # Luminosite selon la piece (D023) multipliee par « Intensite ecran » (D031),
  # jamais sous le plancher.
  - id: retro_cible_calculer
    then:
      - lambda: |-
          float base = ${retro_jour} + id(ldr_obscurite) * (${retro_nuit} - ${retro_jour});
          float k = id(ecran_intensite).state / 100.0f;
          if (isnan(k)) k = ${ecran_intensite_defaut} / 100.0f;
          float c = base * k;
          id(retro_cible) = c < ${retro_plancher} ? ${retro_plancher} : c;
  - id: veille_reveiller
    then:
      - lvgl.resume:
      - lvgl.widget.redraw:
      - script.execute: retro_cible_calculer
      - lambda: id(retro_niveau) = id(retro_cible);
      - light.turn_on:
          id: retroeclairage
          brightness: !lambda return id(retro_niveau);
          transition_length: 0s

interval:
  # Meme periode que la publication de la LDR. Sans mesure : piece eclairee,
  # ecran lisible et LED visible (P2). Ecran eteint : applique au reveil.
  - interval: 2s
    then:
      - lambda: |-
          float v = id(ldr_tension).state;
          float t = isnan(v) ? 0.0f : (v - ${ldr_tension_jour}) / (${ldr_tension_nuit} - ${ldr_tension_jour});
          id(ldr_obscurite) = t < 0.0f ? 0.0f : (t > 1.0f ? 1.0f : t);
      - script.execute: retro_cible_calculer
      - if:
          condition:
            and:
              - not: lvgl.is_paused
              # Ecart minimal : le signal instable de la LDR ne fait pas varier l'ecran.
              - lambda: return fabs(id(retro_cible) - id(retro_niveau)) >= ${retro_ecart_min};
          then:
            - lambda: |-
                id(retro_niveau) = id(retro_cible);
                ESP_LOGD("hapanel.led", "Retroeclairage %.2f", id(retro_niveau));
            - light.turn_on:
                id: retroeclairage
                brightness: !lambda return id(retro_niveau);
                transition_length: 1s
  - interval: 1s
    then:
      # Retour a l'accueil (D022), avant la pause et meme sans Home Assistant.
      - if:
          condition:
            and:
              - not: lvgl.is_paused
              - lambda: return lv_display_get_inactive_time(nullptr) > ${veille_delai_ms} && lv_screen_active() != id(page_accueil).obj;
          then:
            - lvgl.page.show:
                id: page_accueil
                animation: NONE
      # Jamais d'ecran noir sans Home Assistant : le message reste lisible (P2).
      # Message d'accueil affiche : l'ecran reste allume (D028).
      - if:
          condition:
            and:
              - not: lvgl.is_paused
              - lambda: return id(ha_connecte_affiche) == 1 && id(message_ms) == 0 && lv_display_get_inactive_time(nullptr) > ${veille_delai_ms};
          then:
            - light.turn_off: retroeclairage
            - lvgl.pause:
      - if:
          condition:
            and:
              - lvgl.is_paused
              - lambda: return id(ha_connecte_affiche) != 1;
          then:
            - script.execute: veille_reveiller
  - interval: 500ms
    then:
      - lambda: |-
          // Alerte desactivee (D027) : LED eteinte, l'ecran montre le probleme.
          if (!id(led_alerte) || !id(led_alerte_active).state) return;
          id(led_allumee) = !id(led_allumee);
          id(sortie_led_rouge).set_level(id(led_allumee) ? 1.0f : 0.0f);
  # Meme facteur sur les trois canaux : les melanges sont conserves (D018).
  - interval: 50ms
    then:
      - lambda: |-
          if (id(led_alerte)) return;
          // LED « Eteinte » (index 1) ou intensite nulle : facteur nul (D027).
          auto mode = id(led_mode).active_index();
          float intensite = mode.has_value() && *mode == 1 ? 0.0f : id(led_intensite).state / 100.0f;
          if (isnan(intensite)) intensite = ${led_intensite_defaut} / 100.0f;
          float plafond = intensite * (${led_plafond_jour} + id(ldr_obscurite) * (${led_plafond_nuit} - ${led_plafond_jour}));
          // Message d'accueil (D028) : arc-en-ciel au plafond, sans respiration.
          // L'alerte reste prioritaire (P2).
          if (id(message_ms) != 0) {
            float h = (millis() % ${led_arc_periode_ms}) * 6.0f / ${led_arc_periode_ms};
            float x = 1.0f - fabs(fmod(h, 2.0f) - 1.0f);
            float r = 0.0f, g = 0.0f, b = 0.0f;
            switch ((int) h) {
              case 0: r = 1.0f; g = x; break;
              case 1: r = x; g = 1.0f; break;
              case 2: g = 1.0f; b = x; break;
              case 3: g = x; b = 1.0f; break;
              case 4: r = x; b = 1.0f; break;
              default: r = 1.0f; b = x; break;
            }
            id(sortie_led_rouge).set_level(r * plafond);
            id(sortie_led_vert).set_level(g * plafond);
            id(sortie_led_bleu).set_level(b * plafond);
            return;
          }
          float s =0.5f - 0.5f * cos(2.0f * M_PI * (millis() % ${led_periode_ms}) / ${led_periode_ms});
          float k = plafond * (${led_plancher} + (1.0f - ${led_plancher}) * s * s);
          id(sortie_led_rouge).set_level(id(led_rouge) * k);
          id(sortie_led_vert).set_level(id(led_vert) * k);
          id(sortie_led_bleu).set_level(id(led_bleu) * k);
