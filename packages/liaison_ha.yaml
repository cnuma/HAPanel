# Liaison avec Home Assistant (D012). Le panneau ne connait aucune entite :
# un blueprint de Home Assistant lui pousse des valeurs par cle avec l'action
# maj_valeur, et le panneau demande un envoi complet a chaque connexion.
#
# Cles de l'ecran d'accueil (D014) : temperature, chauffage_mode,
# chauffage_action, chauffage_consigne, chauffage_prereglage,
# chauffage_verrou, consigne_min, consigne_max. Affichage :
# packages/pages/accueil.yaml (script accueil_rafraichir).
substitutions:
  # Sans nouvelle valeur pendant ce delai, la valeur affichee est perimee
  # (le blueprint renvoie tout toutes les 5 min).
  liaison_peremption_ms: "900000"

globals:
  # Instant (millis) de la derniere temperature valide recue ; 0 : aucune.
  - id: liaison_temperature_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_temperature
    type: float
    initial_value: "NAN"
  # Etat d'une valeur : 0 non recue, 1 valide, 2 indisponible, 3 perimee.
  - id: liaison_temperature_etat
    type: int
    initial_value: "0"
  # Chauffage : toutes les cles chauffage_* et consigne_* arrivent ensemble ;
  # la peremption porte sur le groupe.
  - id: liaison_chauffage_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_chauffage_etat
    type: int
    initial_value: "0"
  # -1 inconnu, 0 coupe (off), 1 allume (heat).
  - id: liaison_chauffage_mode
    type: int
    initial_value: "-1"
  # -1 inconnue, 0 off, 1 heating, 2 idle, 3 autre.
  - id: liaison_chauffage_action
    type: int
    initial_value: "-1"
  - id: liaison_chauffage_consigne
    type: float
    initial_value: "NAN"
  # Prereglage brut (none, frost, eco, comfort, boost...) ; vide : inconnu.
  - id: liaison_chauffage_prereglage
    type: std::string
    initial_value: '""'
  # -1 inconnu, 0 libre, 1 verrouille.
  - id: liaison_chauffage_verrou
    type: int
    initial_value: "-1"
  - id: liaison_consigne_min
    type: float
    initial_value: "NAN"
  - id: liaison_consigne_max
    type: float
    initial_value: "NAN"

api:
  actions:
    - action: maj_valeur
      variables:
        cle: string
        valeur: string
      then:
        - lambda: |-
            // cle et valeur pointent dans le tampon de reception, sans zero
            // terminal : copie bornee avant toute conversion.
            char k[24], v[24];
            snprintf(k, sizeof(k), "%.*s", (int) cle.size(), cle.c_str());
            snprintf(v, sizeof(v), "%.*s", (int) valeur.size(), valeur.c_str());
            char *fin = nullptr;
            float f = strtof(v, &fin);
            // unavailable, unknown ou valeur illisible : pas un nombre (P3).
            bool nombre = fin != v && *fin == '\0' && !isnan(f);
            uint32_t maintenant = millis();
            if (maintenant == 0) maintenant = 1;
            if (strcmp(k, "temperature") == 0) {
              id(liaison_temperature) = nombre ? f : NAN;
              id(liaison_temperature_etat) = nombre ? 1 : 2;
              id(liaison_temperature_ms) = nombre ? maintenant : 0;
            } else if (strcmp(k, "chauffage_mode") == 0) {
              id(liaison_chauffage_mode) = strcmp(v, "heat") == 0 ? 1 : strcmp(v, "off") == 0 ? 0 : -1;
            } else if (strcmp(k, "chauffage_action") == 0) {
              id(liaison_chauffage_action) = strcmp(v, "off") == 0 ? 0 : strcmp(v, "heating") == 0 ? 1
                  : strcmp(v, "idle") == 0 ? 2
                  : (strcmp(v, "unavailable") == 0 || strcmp(v, "unknown") == 0) ? -1 : 3;
            } else if (strcmp(k, "chauffage_consigne") == 0) {
              id(liaison_chauffage_consigne) = nombre ? f : NAN;
            } else if (strcmp(k, "chauffage_prereglage") == 0) {
              bool inconnu = strcmp(v, "unavailable") == 0 || strcmp(v, "unknown") == 0;
              id(liaison_chauffage_prereglage) = inconnu ? "" : v;
            } else if (strcmp(k, "chauffage_verrou") == 0) {
              id(liaison_chauffage_verrou) = strcmp(v, "on") == 0 ? 1 : strcmp(v, "off") == 0 ? 0 : -1;
            } else if (strcmp(k, "consigne_min") == 0) {
              id(liaison_consigne_min) = nombre ? f : NAN;
            } else if (strcmp(k, "consigne_max") == 0) {
              id(liaison_consigne_max) = nombre ? f : NAN;
            } else {
              ESP_LOGW("hapanel.liaison", "cle inconnue : %s", k);
              return;
            }
            if (strncmp(k, "temperature", 11) != 0) {
              id(liaison_chauffage_ms) = maintenant;
              id(liaison_chauffage_etat) = 1;
            }
            ESP_LOGI("hapanel.liaison", "%s %s", k, v);
            id(accueil_rafraichir).execute();

script:
  # Appeles par le suivi de connexion (packages/lvgl.yaml) a chaque
  # changement d'etat.
  - id: liaison_connectee
    then:
      - script.execute: accueil_rafraichir
      # Demande au blueprint de renvoyer toutes les valeurs. Exige
      # l'autorisation des actions Home Assistant pour ce module (08).
      - homeassistant.event:
          event: esphome.hapanel_demande_valeurs
  - id: liaison_deconnectee
    then:
      # Sans Home Assistant, plus rien ne garantit les valeurs (P2, P3).
      - lambda: |-
          id(liaison_temperature_ms) = 0;
          id(liaison_temperature) = NAN;
          id(liaison_temperature_etat) = 0;
      - script.execute:
          id: liaison_chauffage_effacer
          etat: 0
      - script.execute: accueil_rafraichir
  # Efface les valeurs du chauffage ; etat 0 (non recu) ou 3 (perime).
  - id: liaison_chauffage_effacer
    parameters:
      etat: int
    then:
      - lambda: |-
          id(liaison_chauffage_ms) = 0;
          id(liaison_chauffage_etat) = etat;
          id(liaison_chauffage_mode) = -1;
          id(liaison_chauffage_action) = -1;
          id(liaison_chauffage_consigne) = NAN;
          id(liaison_chauffage_prereglage) = "";
          id(liaison_chauffage_verrou) = -1;
          id(liaison_consigne_min) = NAN;
          id(liaison_consigne_max) = NAN;

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_temperature_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - lambda: |-
                id(liaison_temperature_ms) = 0;
                id(liaison_temperature) = NAN;
                id(liaison_temperature_etat) = 3;
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "temperature perimee"
            - script.execute: accueil_rafraichir
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_chauffage_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - script.execute:
                id: liaison_chauffage_effacer
                etat: 3
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "chauffage perime"
            - script.execute: accueil_rafraichir
