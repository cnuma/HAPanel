# Liaison avec Home Assistant (D012). Le panneau ne connait aucune entite :
# un blueprint de Home Assistant lui pousse des valeurs par cle avec l'action
# maj_valeur, et le panneau demande un envoi complet a chaque connexion.
#
# Cles de l'ecran d'accueil (D014, D016, D040) : piece, temperature,
# temperature_exterieure, chauffage_mode, chauffage_action,
# chauffage_consigne, chauffage_prereglage, chauffage_verrou, consigne_min,
# consigne_max. Affichage :
# packages/pages/accueil.yaml (script accueil_rafraichir).
#
# Cles de l'ecran meteo (D019) : meteo_condition, meteo_temperature et, pour
# N de 1 a 3, meteo_jN_jour, meteo_jN_condition, meteo_jN_max, meteo_jN_min.
# Affichage : packages/pages/meteo.yaml (script meteo_rafraichir).
#
# Cles de l'ecran planning (D020), pour N de 1 a 4 : plan_N_nom, plan_N_creneaux.
# Affichage : packages/pages/planning.yaml (script planning_rafraichir).
#
# Cles de l'ecran scenarios (D024, D026), pour N de 1 a 6 : scen_N_nom, scen_N_icone,
# scen_N_couleur ; et scen_resultat.
# Affichage : packages/pages/scenarios.yaml (script scenarios_rafraichir).
#
# Reglages du module (D027, D031) : led_mode (respiration, eteinte),
# led_intensite (0 a 100), led_alerte (on, off), ecran_intensite (20 a 100),
# message_intensite (20 a 100, T13).
# « libre » : le blueprint n'impose pas ce reglage (D031). Entites :
# packages/led_veille.yaml ; page : packages/pages/reglages.yaml.
substitutions:
  # Sans nouvelle valeur pendant ce delai, la valeur affichee est perimee
  # (le blueprint renvoie tout toutes les 5 min).
  liaison_peremption_ms: "900000"

globals:
  # Instant (millis) de la derniere temperature valide recue ; 0 : aucune.
  - id: liaison_temperature_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_temperature
    type: float
    initial_value: "NAN"
  # Etat d'une valeur : 0 non recue, 1 valide, 2 indisponible, 3 perimee.
  - id: liaison_temperature_etat
    type: int
    initial_value: "0"
  # Temperature exterieure (D016) : meme logique que la temperature.
  - id: liaison_exterieure_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_exterieure
    type: float
    initial_value: "NAN"
  - id: liaison_exterieure_etat
    type: int
    initial_value: "0"
  # Chauffage : toutes les cles chauffage_* et consigne_* arrivent ensemble ;
  # la peremption porte sur le groupe.
  - id: liaison_chauffage_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_chauffage_etat
    type: int
    initial_value: "0"
  # -1 inconnu, 0 coupe (off), 1 allume (heat).
  - id: liaison_chauffage_mode
    type: int
    initial_value: "-1"
  # -1 inconnue, 0 off, 1 heating, 2 idle, 3 autre.
  - id: liaison_chauffage_action
    type: int
    initial_value: "-1"
  - id: liaison_chauffage_consigne
    type: float
    initial_value: "NAN"
  # Prereglage brut (none, frost, eco, comfort, boost...) ; vide : inconnu.
  - id: liaison_chauffage_prereglage
    type: std::string
    initial_value: '""'
  # -1 inconnu, 0 libre, 1 verrouille.
  - id: liaison_chauffage_verrou
    type: int
    initial_value: "-1"
  - id: liaison_consigne_min
    type: float
    initial_value: "NAN"
  - id: liaison_consigne_max
    type: float
    initial_value: "NAN"
  # Meteo (D019) : peremption sur le groupe, etat donne par meteo_condition.
  - id: liaison_meteo_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_meteo_etat
    type: int
    initial_value: "0"
  # Conditions : indice dans la liste de maj_valeur ; -1 inconnue.
  - id: liaison_meteo_condition
    type: int
    initial_value: "-1"
  - id: liaison_meteo_temperature
    type: float
    initial_value: "NAN"
  # Jour de la semaine : 0 lundi ; -1 inconnu.
  - id: liaison_meteo_jour
    type: std::array<int, 3>
    initial_value: "{{-1, -1, -1}}"
  - id: liaison_meteo_jour_condition
    type: std::array<int, 3>
    initial_value: "{{-1, -1, -1}}"
  - id: liaison_meteo_max
    type: std::array<float, 3>
    initial_value: "{{NAN, NAN, NAN}}"
  - id: liaison_meteo_min
    type: std::array<float, 3>
    initial_value: "{{NAN, NAN, NAN}}"
  # Planning (D020) : peremption sur le groupe. Nom vide : non recu ; « - » :
  # pas de calendrier. Creneaux : « h » + 24 chiffres hexadecimaux ; « ? » :
  # indisponible.
  - id: liaison_planning_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_planning_etat
    type: int
    initial_value: "0"
  - id: liaison_planning_nom
    type: std::array<std::string, 4>
  - id: liaison_planning_creneaux
    type: std::array<std::string, 4>
  # Scenarios (D024) : peremption sur le groupe. Nom vide : non recu ; « - » : pas
  # de scenario ; « ? » : indisponible.
  - id: liaison_scenarios_ms
    type: uint32_t
    initial_value: "0"
  - id: liaison_scenarios_etat
    type: int
    initial_value: "0"
  - id: liaison_scenarios_nom
    type: std::array<std::string, 6>
  # Valeurs du blueprint, traduites par scenarios_rafraichir.
  - id: liaison_scenarios_icone
    type: std::array<std::string, 6>
  - id: liaison_scenarios_couleur
    type: std::array<std::string, 6>

api:
  actions:
    - action: maj_valeur
      variables:
        cle: string
        valeur: string
      then:
        - lambda: |-
            // cle et valeur pointent dans le tampon de reception, sans zero
            // terminal : copie bornee avant toute conversion.
            char k[24], v[32];
            snprintf(k, sizeof(k), "%.*s", (int) cle.size(), cle.c_str());
            snprintf(v, sizeof(v), "%.*s", (int) valeur.size(), valeur.c_str());
            char *fin = nullptr;
            float f = strtof(v, &fin);
            // unavailable, unknown ou valeur illisible : pas un nombre (P3).
            bool nombre = fin != v && *fin == '\0' && !isnan(f);
            uint32_t maintenant = millis();
            if (maintenant == 0) maintenant = 1;
            // Nom de la piece (D040) : texte seul, sans etat ni peremption ; un
            // nom vide garde le precedent.
            if (strcmp(k, "piece") == 0) {
              if (v[0] != '\0' && id(lbl_acc_sejour) != nullptr) lv_label_set_text(id(lbl_acc_sejour), v);
              ESP_LOGI("hapanel.liaison", "%s %s", k, v);
              return;
            }
            // Meteo : traitee a part, elle ne doit pas rafraichir le chauffage (P3).
            if (strncmp(k, "meteo_", 6) == 0) {
              static const char *const conditions[] = {
                  "clear-night", "cloudy", "exceptional", "fog", "hail", "lightning", "lightning-rainy",
                  "partlycloudy", "pouring", "rainy", "snowy", "snowy-rainy", "sunny", "windy", "windy-variant"};
              int cond = -1;
              for (int i = 0; i < 15; i++) if (strcmp(v, conditions[i]) == 0) cond = i;
              const char *c = k + 6;
              if (strcmp(c, "condition") == 0) {
                id(liaison_meteo_condition) = cond;
                id(liaison_meteo_etat) = cond != -1 ? 1 : 2;
              } else if (strcmp(c, "temperature") == 0) {
                id(liaison_meteo_temperature) = nombre ? f : NAN;
              } else if (c[0] == 'j' && c[1] >= '1' && c[1] <= '3' && c[2] == '_') {
                int j = c[1] - '1';
                const char *n = c + 3;
                if (strcmp(n, "jour") == 0) id(liaison_meteo_jour)[j] = nombre && f >= 0 && f <= 6 ? (int) f : -1;
                else if (strcmp(n, "condition") == 0) id(liaison_meteo_jour_condition)[j] = cond;
                else if (strcmp(n, "max") == 0) id(liaison_meteo_max)[j] = nombre ? f : NAN;
                else if (strcmp(n, "min") == 0) id(liaison_meteo_min)[j] = nombre ? f : NAN;
                else {
                  ESP_LOGW("hapanel.liaison", "cle inconnue : %s", k);
                  return;
                }
              } else {
                ESP_LOGW("hapanel.liaison", "cle inconnue : %s", k);
                return;
              }
              id(liaison_meteo_ms) = id(liaison_meteo_etat) == 1 ? maintenant : 0;
              ESP_LOGI("hapanel.liaison", "%s %s", k, v);
              id(meteo_rafraichir).execute();
              return;
            }
            // Reglages imposes par le blueprint (D027, D031) : appliques aux
            // entites du module, que HA affiche aussitot. Rien ne change s'ils
            // sont deja en place, pas d'ecriture en flash toutes les 5 min (G3).
            // « libre » : reglage laisse au module et a la page de l'appareil.
            if (strncmp(k, "led_", 4) == 0 || strcmp(k, "ecran_intensite") == 0 || strcmp(k, "message_intensite") == 0) {
              bool libre = strcmp(v, "libre") == 0;
              if (strcmp(k, "led_mode") == 0 && (libre || strcmp(v, "respiration") == 0 || strcmp(v, "eteinte") == 0)) {
                id(reglage_impose_led_mode) = !libre;
                size_t i = v[0] == 'e' ? 1 : 0;
                auto actuel = id(led_mode).active_index();
                if (!libre && (!actuel.has_value() || *actuel != i)) id(led_mode).make_call().set_index(i).perform();
              } else if (strcmp(k, "led_intensite") == 0 && (libre || (nombre && f >= 0 && f <= 100))) {
                id(reglage_impose_led_intensite) = !libre;
                if (!libre && id(led_intensite).state != f) id(led_intensite).make_call().set_value(f).perform();
              } else if (strcmp(k, "led_alerte") == 0 && (libre || strcmp(v, "on") == 0 || strcmp(v, "off") == 0)) {
                id(reglage_impose_led_alerte) = !libre;
                bool on = v[1] == 'n';
                if (!libre && id(led_alerte_active).state != on) {
                  if (on) id(led_alerte_active).turn_on(); else id(led_alerte_active).turn_off();
                }
              } else if (strcmp(k, "ecran_intensite") == 0 && (libre || (nombre && f >= ${ecran_intensite_min} && f <= 100))) {
                id(reglage_impose_ecran_intensite) = !libre;
                if (!libre && id(ecran_intensite).state != f) id(ecran_intensite).make_call().set_value(f).perform();
              } else if (strcmp(k, "message_intensite") == 0 && (libre || (nombre && f >= ${ecran_intensite_min} && f <= 100))) {
                id(reglage_impose_message_intensite) = !libre;
                if (!libre && id(message_intensite).state != f) id(message_intensite).make_call().set_value(f).perform();
              } else {
                ESP_LOGW("hapanel.liaison", "cle ou valeur inconnue : %s %s", k, v);
                return;
              }
              ESP_LOGI("hapanel.liaison", "%s %s", k, v);
              id(reglages_rafraichir).execute();
              return;
            }
            // Planning : traite a part, comme la meteo (P3).
            if (strncmp(k, "plan_", 5) == 0) {
              int r = k[5] - '1';
              if (r < 0 || r > 3 || k[6] != '_') {
                ESP_LOGW("hapanel.liaison", "cle inconnue : %s", k);
                return;
              }
              if (strcmp(k + 7, "nom") == 0) {
                id(liaison_planning_nom)[r] = v;
              } else if (strcmp(k + 7, "creneaux") == 0) {
                bool ok = strlen(v) == 25 && v[0] == 'h' && strspn(v + 1, "0123456789abcdefABCDEF") == 24;
                id(liaison_planning_creneaux)[r] = ok ? v : "?";
              } else {
                ESP_LOGW("hapanel.liaison", "cle inconnue : %s", k);
                return;
              }
              id(liaison_planning_ms) = maintenant;
              id(liaison_planning_etat) = 1;
              ESP_LOGI("hapanel.liaison", "%s %s", k, v);
              id(planning_rafraichir).execute();
              return;
            }
            // Scenarios : traites a part, comme la meteo (P3).
            if (strncmp(k, "scen_", 5) == 0) {
              int r = k[5] - '1';
              if (strcmp(k + 5, "resultat") == 0) {
                // Reponse tardive ignoree : « pas de reponse » reste affiche.
                if (id(scenarios_retour) == 1) {
                  id(scenarios_retour) = strcmp(v, "ok") == 0 ? 2 : 4;
                  id(scenarios_retour_ms) = maintenant;
                }
              } else if (r >= 0 && r <= 5 && strcmp(k + 6, "_nom") == 0) {
                id(liaison_scenarios_nom)[r] = v;
                id(liaison_scenarios_ms) = maintenant;
                id(liaison_scenarios_etat) = 1;
              } else if (r >= 0 && r <= 5 && strcmp(k + 6, "_icone") == 0) {
                id(liaison_scenarios_icone)[r] = v;
              } else if (r >= 0 && r <= 5 && strcmp(k + 6, "_couleur") == 0) {
                id(liaison_scenarios_couleur)[r] = v;
              } else {
                ESP_LOGW("hapanel.liaison", "cle inconnue : %s", k);
                return;
              }
              ESP_LOGI("hapanel.liaison", "%s %s", k, v);
              id(scenarios_rafraichir).execute();
              return;
            }
            if (strcmp(k, "temperature") == 0) {
              id(liaison_temperature) = nombre ? f : NAN;
              id(liaison_temperature_etat) = nombre ? 1 : 2;
              id(liaison_temperature_ms) = nombre ? maintenant : 0;
            } else if (strcmp(k, "temperature_exterieure") == 0) {
              id(liaison_exterieure) = nombre ? f : NAN;
              id(liaison_exterieure_etat) = nombre ? 1 : 2;
              id(liaison_exterieure_ms) = nombre ? maintenant : 0;
            } else if (strcmp(k, "chauffage_mode") == 0) {
              id(liaison_chauffage_mode) = strcmp(v, "heat") == 0 ? 1 : strcmp(v, "off") == 0 ? 0 : -1;
            } else if (strcmp(k, "chauffage_action") == 0) {
              id(liaison_chauffage_action) = strcmp(v, "off") == 0 ? 0 : strcmp(v, "heating") == 0 ? 1
                  : strcmp(v, "idle") == 0 ? 2
                  : (strcmp(v, "unavailable") == 0 || strcmp(v, "unknown") == 0) ? -1 : 3;
            } else if (strcmp(k, "chauffage_consigne") == 0) {
              id(liaison_chauffage_consigne) = nombre ? f : NAN;
            } else if (strcmp(k, "chauffage_prereglage") == 0) {
              bool inconnu = strcmp(v, "unavailable") == 0 || strcmp(v, "unknown") == 0;
              id(liaison_chauffage_prereglage) = inconnu ? "" : v;
            } else if (strcmp(k, "chauffage_verrou") == 0) {
              id(liaison_chauffage_verrou) = strcmp(v, "on") == 0 ? 1 : strcmp(v, "off") == 0 ? 0 : -1;
            } else if (strcmp(k, "consigne_min") == 0) {
              id(liaison_consigne_min) = nombre ? f : NAN;
            } else if (strcmp(k, "consigne_max") == 0) {
              id(liaison_consigne_max) = nombre ? f : NAN;
            } else {
              ESP_LOGW("hapanel.liaison", "cle inconnue : %s", k);
              return;
            }
            if (strncmp(k, "temperature", 11) != 0) {
              id(liaison_chauffage_ms) = maintenant;
              id(liaison_chauffage_etat) = 1;
            }
            ESP_LOGI("hapanel.liaison", "%s %s", k, v);
            id(accueil_rafraichir).execute();

script:
  # Appeles par le suivi de connexion (packages/lvgl.yaml) a chaque
  # changement d'etat.
  - id: liaison_connectee
    then:
      - script.execute: accueil_rafraichir
      - script.execute: meteo_rafraichir
      - script.execute: planning_rafraichir
      - script.execute: scenarios_rafraichir
      # Demande au blueprint de renvoyer toutes les valeurs. Un evenement ne
      # demande pas l'autorisation des actions Home Assistant (teste le
      # 2 novembre 2026, 08).
      - homeassistant.event:
          event: esphome.hapanel_demande_valeurs
  - id: liaison_deconnectee
    then:
      - script.execute: message_fermer
      # Sans Home Assistant, plus rien ne garantit les valeurs (P2, P3).
      - lambda: |-
          id(liaison_temperature_ms) = 0;
          id(liaison_temperature) = NAN;
          id(liaison_temperature_etat) = 0;
          id(liaison_exterieure_ms) = 0;
          id(liaison_exterieure) = NAN;
          id(liaison_exterieure_etat) = 0;
      - script.execute:
          id: liaison_chauffage_effacer
          etat: 0
      - script.execute: accueil_rafraichir
      - script.execute:
          id: liaison_meteo_effacer
          etat: 0
      - script.execute: meteo_rafraichir
      - script.execute:
          id: liaison_planning_effacer
          etat: 0
      - script.execute: planning_rafraichir
      - script.execute:
          id: liaison_scenarios_effacer
          etat: 0
      - script.execute: scenarios_rafraichir
  # Efface les scenarios ; etat 0 (non recus) ou 3 (perimes).
  - id: liaison_scenarios_effacer
    parameters:
      etat: int
    then:
      - lambda: |-
          id(liaison_scenarios_ms) = 0;
          id(liaison_scenarios_etat) = etat;
          id(liaison_scenarios_nom).fill("");
          id(liaison_scenarios_icone).fill("");
          id(liaison_scenarios_couleur).fill("");
          id(scenarios_retour) = 0;
  # Efface le planning ; etat 0 (non recu) ou 3 (perime).
  - id: liaison_planning_effacer
    parameters:
      etat: int
    then:
      - lambda: |-
          id(liaison_planning_ms) = 0;
          id(liaison_planning_etat) = etat;
          id(liaison_planning_nom).fill("");
          id(liaison_planning_creneaux).fill("");
  # Efface les valeurs de la meteo ; etat 0 (non recue) ou 3 (perimee).
  - id: liaison_meteo_effacer
    parameters:
      etat: int
    then:
      - lambda: |-
          id(liaison_meteo_ms) = 0;
          id(liaison_meteo_etat) = etat;
          id(liaison_meteo_condition) = -1;
          id(liaison_meteo_temperature) = NAN;
          id(liaison_meteo_jour).fill(-1);
          id(liaison_meteo_jour_condition).fill(-1);
          id(liaison_meteo_max).fill(NAN);
          id(liaison_meteo_min).fill(NAN);
  # Efface les valeurs du chauffage ; etat 0 (non recu) ou 3 (perime).
  - id: liaison_chauffage_effacer
    parameters:
      etat: int
    then:
      - lambda: |-
          id(liaison_chauffage_ms) = 0;
          id(liaison_chauffage_etat) = etat;
          id(liaison_chauffage_mode) = -1;
          id(liaison_chauffage_action) = -1;
          id(liaison_chauffage_consigne) = NAN;
          id(liaison_chauffage_prereglage) = "";
          id(liaison_chauffage_verrou) = -1;
          id(liaison_consigne_min) = NAN;
          id(liaison_consigne_max) = NAN;

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_temperature_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - lambda: |-
                id(liaison_temperature_ms) = 0;
                id(liaison_temperature) = NAN;
                id(liaison_temperature_etat) = 3;
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "temperature perimee"
            - script.execute: accueil_rafraichir
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_exterieure_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - lambda: |-
                id(liaison_exterieure_ms) = 0;
                id(liaison_exterieure) = NAN;
                id(liaison_exterieure_etat) = 3;
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "temperature exterieure perimee"
            - script.execute: accueil_rafraichir
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_chauffage_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - script.execute:
                id: liaison_chauffage_effacer
                etat: 3
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "chauffage perime"
            - script.execute: accueil_rafraichir
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_meteo_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - script.execute:
                id: liaison_meteo_effacer
                etat: 3
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "meteo perimee"
            - script.execute: meteo_rafraichir
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_planning_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - script.execute:
                id: liaison_planning_effacer
                etat: 3
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "planning perime"
            - script.execute: planning_rafraichir
      - if:
          condition:
            lambda: |-
              uint32_t t = id(liaison_scenarios_ms);
              return t != 0 && millis() - t > ${liaison_peremption_ms};
          then:
            - script.execute:
                id: liaison_scenarios_effacer
                etat: 3
            - logger.log:
                tag: hapanel.liaison
                level: WARN
                format: "scenarios perimes"
            - script.execute: scenarios_rafraichir
