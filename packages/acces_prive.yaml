# Acces des modules du proprietaire : Wi-Fi et cle de l'API compiles dans le
# binaire, lus dans secrets.yaml (G9). Ce binaire ne doit jamais etre publie
# (D038, D039).
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Chiffree par la cle de l'API, heritee faute de cle propre (D010).
    encryption:

# Boutons de mise a jour des pages A propos et Menu (D047) : toujours masques
# ici, faute d'entite de mise a jour ; scripts vides pour que les pages
# communes compilent. Le binaire prive se met a jour par l'OTA esphome.
script:
  - id: maj_rechercher
    then:
      - logger.log: "binaire prive : pas de recherche de mise a jour"
  - id: maj_proposer
    then:
      - logger.log: "binaire prive : pas de mise a jour depuis l'ecran"
