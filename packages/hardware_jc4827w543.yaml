# Materiel : Guition JC4827W543C_I, ecran 4,3" capacitif, ESP32-S3 (D049).
# Seul fichier qui declare broches et bus pour cette carte (invariant G2) ;
# memes id que hardware.yaml, le reste du panneau ne change pas.
#
# Brochage confirme sur cette carte par AquaLook le 27 aout 2026
# (docs/architecture/HW_JC4827W543_PORT_IMPACT.md du depot cnuma/AquaLook) :
# ecran NV3041A en QSPI, tactile GT911, retroeclairage GPIO1. A confirmer
# avec ESPHome au banc (cahier Q).
#
# Ni LED RVB ni LDR sur cette carte (choix du proprietaire, 9 novembre 2026) :
# sorties et capteur sans effet, memes id que les autres cartes.
#
# Ecran 480 x 272 en paysage, port USB a gauche, pages du format paysage
# (D053, TODO T04 ; jusqu'a 0.11.2 : portrait provisoire, D049).
substitutions:
  pin_qspi_clk: GPIO47
  pin_qspi_d0: GPIO21
  pin_qspi_d1: GPIO48
  pin_qspi_d2: GPIO40
  pin_qspi_d3: GPIO39
  pin_retroeclairage: GPIO1
  pin_i2c_sda: GPIO8
  pin_i2c_scl: GPIO4
  pin_tactile_int: GPIO3
  pin_tactile_rst: GPIO38

# Positions et tailles des pages pour cet ecran (D053).
packages:
  format: !include format_paysage.yaml

# Puce de la carte (D049) : ESP32-S3, 4 Mo de flash, 8 Mo de PSRAM octale.
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# Exigee par le modele d'ecran d'ESPHome ; tampon de LVGL et rotation.
psram:
  mode: octal
  speed: 80MHz

spi:
  id: bus_spi_ecran
  type: quad
  clk_pin: ${pin_qspi_clk}
  data_pins:
    - ${pin_qspi_d0}
    - ${pin_qspi_d1}
    - ${pin_qspi_d2}
    - ${pin_qspi_d3}

i2c:
  id: bus_i2c_tactile
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  frequency: 400kHz

output:
  - platform: ledc
    id: sortie_retroeclairage
    pin: ${pin_retroeclairage}
  # Pas de LED RVB : sorties sans effet, ecrites par led_veille.yaml.
  - platform: template
    id: sortie_led_rouge
    type: float
    write_action: []
  - platform: template
    id: sortie_led_vert
    type: float
    write_action: []
  - platform: template
    id: sortie_led_bleu
    type: float
    write_action: []

sensor:
  # Pas de LDR : tension de plein jour (0 V, la tension monte dans le noir sur
  # les autres cartes), donc retroeclairage de jour, regle par « Intensite
  # ecran » (D023, D031). Interne, aucune entite HA.
  - platform: template
    id: ldr_tension
    internal: true
    lambda: return 0.0f;
    update_interval: 60s

light:
  - platform: monochromatic
    id: retroeclairage
    name: "Rétroéclairage"
    output: sortie_retroeclairage
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: mipi_spi
    id: ecran
    model: JC4827W543
    spi_id: bus_spi_ecran

touchscreen:
  - platform: gt911
    id: tactile
    i2c_id: bus_i2c_tactile
    display: ecran
    interrupt_pin:
      number: ${pin_tactile_int}
      ignore_strapping_warning: true
    reset_pin: ${pin_tactile_rst}
    # LVGL tourne l'image et le toucher (rotation plus bas) ; le GT911 est monte
    # a 180 degres de l'ecran : ses deux axes sont inverses (comme dans AquaLook).
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true

# Paysage, port USB a gauche (D053) : en portrait, rotation de 270 degres, la
# barre d'etat etait du cote oppose au port USB (cahier Q2), donc le port est a
# droite de l'image native ; 180 degres le met a gauche. A confirmer sur la
# carte (cahier U). Rotation logicielle de LVGL ; le tactile suit.
lvgl:
  rotation: 180
